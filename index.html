<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Помощник школьника</title>
<meta name="theme-color" content="#6a4fc2">
<style>
:root{--v:#6a4fc2;--vl:#ece6fb;--bg:#faf8ff;--ink:#1d1b26;--mut:#625d72;--ok:#1b7f3b;--err:#b3261e;--warn:#b25a00;--line:#ddd6ee}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px 0}
.brand{font-weight:700;font-size:18px;color:var(--v);margin-bottom:6px}
#tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
#tabs button{border:0;background:none;padding:10px 14px;font:inherit;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
#tabs button.on{color:var(--v);border-bottom-color:var(--v);font-weight:600}
main{max-width:820px;margin:0 auto;padding:16px}
h2{margin:4px 0 2px;font-size:22px}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card.tint{background:var(--vl);border-color:transparent}
.card.good{background:#d1f0dd;border-color:transparent}
.card.bad{background:#fce4e1;border-color:transparent}
.card.warn{background:#fff0d6;border-color:transparent}
.card.okl{background:#e8f5ec;border-color:transparent}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
button.b{font:inherit;font-weight:600;border:0;border-radius:999px;padding:11px 18px;background:var(--v);color:#fff;cursor:pointer;margin:8px 8px 0 0;max-width:100%}
button.b.t{background:var(--vl);color:var(--v)}
button.b.o{background:#fff;color:var(--v);border:1px solid var(--v)}
button.b:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
.chips button.on{background:var(--v);border-color:var(--v);color:#fff}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em}
.tag.e{color:var(--err)}.tag.c{color:var(--warn)}.tag.o{color:var(--ok)}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:4px 0}
.err{color:var(--err);margin:8px 0}.okt{color:var(--ok);margin:8px 0}.mut{color:var(--mut);font-size:14px}
.photo{max-width:100%;max-height:260px;border-radius:12px;display:block;margin-top:8px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-size:30px}
.dots{display:flex;gap:6px;margin-top:6px}.dots i{width:18px;height:18px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--v)}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--vl);border-top-color:var(--v);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (max-width:520px){main{padding:12px}button.b{width:100%}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{font:inherit;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;color:var(--ink)}
.tile b{display:block;font-size:16px;margin-bottom:4px;color:var(--v)}.tile span{color:var(--mut);font-size:13px}
.tile:hover{border-color:var(--v)}
button.back{margin:0 0 10px}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.swrow input{width:22px;height:22px;flex:none}
.tbl{width:100%;border-collapse:collapse;margin:6px 0}.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
#lock{position:fixed;inset:0;z-index:50;background:rgba(250,248,255,.98);display:flex;align-items:center;justify-content:center;padding:16px}
.lockbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;max-width:420px;width:100%}
canvas,svg.fig{max-width:100%}
.msg{padding:10px 14px;border-radius:16px;margin:8px 0;max-width:92%}.msg.me{background:var(--vl);margin-left:auto}.msg.ai{background:#fff;border:1px solid var(--line)}
.flash{min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:18px}
#gate{position:fixed;inset:0;z-index:60;background:#faf8ff;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}

</style>
</head>

<header class="top">
  <div class="brand">Помощник школьника</div>
  <nav id="tabs" aria-label="Разделы"></nav>
</header>
<main id="view"></main>

// Слияние данных телефона и компьютера. Та же логика, что в SyncRules.kt.

<script>
// Тексты для ИИ и разбор ответа проверки. Те же, что в Prompts.kt и CheckParser.kt.
(function (root) {
  function who(grade) {
    var g = String(grade || '').replace(/\D/g, '');

  }
  function base(grade) {
    return 'Ты помощник ' + who(grade) + '. Отвечай по-русски, простыми словами, дружелюбно, коротко и по делу. ' +
      'Не используй markdown: никаких #, *, **, обратных кавычек и таблиц, пиши обычным текстом. ' +
      'Формулы пиши в одну строку, используя знаки −, ·, : и степени ², ³. ' +
      'Ничего не выдумывай: если не уверен в факте, так и скажи. Если не хватает данных, попроси их.';
  }
  function check(subject, grade) {
    return base(grade) +
      ' Проверь решение ученика по предмету «' + subject + '». Тебе дано задание и записи ученика (текст или фото). ' +
      'Для каждой строки решения определи статус: ok, error (ошибка именно в этой строке) или consequence ' +
      '(строка сама по себе верна, но опирается на ошибку выше). ' +
      'Верни ТОЛЬКО JSON без пояснений вокруг: ' +
      '{"verdict":"ok или errors","summary":"одно-два предложения",' +
      '"lines":[{"text":"строка ученика как написана","status":"ok|error|consequence",' +
      '"why":"что не так, простыми словами (только для error)","fix":"как правильно (только для error)"}],' +
      '"correct":"верное решение кратко"}. ' +
      'Перепроверь арифметику сам: подставь ответ в условие. Если запись неразборчива, так и напиши в summary. ' +
      'Для русского языка lines это предложения или слова с ошибками, в why назови правило.';
  }

  function help(mode, subject, grade) {
    var head = base(grade) + ' Предмет: «' + subject + '». ';
    if (mode === 'hint') return head + 'Не давай готового ответа. Дай одну подсказку и один наводящий вопрос, чтобы ученик продвинулся сам.';

</script>

window.KidData.cheats = {"subjects":["Алгебра","Геометрия","Физика","Русский","Химия","История"],"sheets":[{"id":"alg-short","subject":"Алгебра","title":"Формулы сокращённого умножения","text":"(a + b)² = a² + 2ab + b²\n(a − b)² = a² − 2ab + b²\na² − b² = (a − b)(a + b)\n(a + b)³ = a³ + 3a²b + 3ab² + b³\na³ + b³ = (a + b)(a² − ab + b²)\na³ − b³ = (a − b)(a² + ab + b²)"},{"id":"alg-quad","subject":"Алгебра","title":"Квадратное уравнение","text":"ax² + bx + c = 0, a ≠ 0\nD = b² − 4ac\nD > 0: два корня x = (−b ± √D) / 2a\nD = 0: один корень x = −b / 2a\nD < 0: действительных корней нет\nТеорема Виета для x² + px + q = 0:\nx₁ + x₂ = −p, x₁ · x₂ = q"},{"id":"alg-linear","subject":"Алгебра","title":"Линейное уравнение","text":"ax + b = c\n1. Слагаемое b переносим в другую часть с противоположным знаком.\n2. Делим обе части на a.\nПример: 2x + 6 = 14, 2x = 14 − 6, 2x = 8, x = 4.\nПроверка: подставь ответ в уравнение."},{"id":"alg-powers","subject":"Алгебра","title":"Свойства степеней","text":"aᵐ · aⁿ = aᵐ⁺ⁿ\naᵐ : aⁿ = aᵐ⁻ⁿ\n(aᵐ)ⁿ = aᵐⁿ\n(ab)ⁿ = aⁿbⁿ\na⁰ = 1 при a ≠ 0\na⁻ⁿ = 1 / aⁿ"},{"id":"alg-func","subject":"Алгебра","title":"Линейная функция и парабола","text":"y = kx + b: график прямая. k задаёт наклон, b показывает, где график пересекает ось y.\ny = ax² + bx + c: график парабола. При a > 0 ветви вверх, при a < 0 вниз.\nВершина параболы: x₀ = −b / 2a, y₀ подставь x₀ в формулу."},{"id":"alg-percent","subject":"Алгебра","title":"Проценты и дроби","text":"1% от числа = число : 100.\nНайти p% от числа: число · p / 100.\nНайти число по его части: часть : доля.\nСложение дробей: привести к общему знаменателю, сложить числители.\nУмножение дробей: числитель на числитель, знаменатель на знаменатель."},{"id":"geo-triangle","subject":"Геометрия","title":"Треугольник","text":"Сумма углов треугольника 180°.\nПлощадь S = ½ · a · h (сторона и высота к ней).\nНеравенство треугольника: каждая сторона меньше суммы двух других.\nВ равнобедренном треугольнике углы при основании равны.\nВнешний угол равен сумме двух внутренних, не смежных с ним."},{"id":"geo-pyth","subject":"Геометрия","title":"Теорема Пифагора","text":"В прямоугольном треугольнике a² + b² = c², где a и b катеты, c гипотенуза.\nПример: катеты 6 и 8, c² = 36 + 64 = 100, c = 10.\nОбратная теорема: если a² + b² = c², треугольник прямоугольный."},{"id":"geo-quad","subject":"Геометрия","title":"Четырёхугольники","text":"Сумма углов четырёхугольника 360°.\nПрямоугольник: S = a · b.\nПараллелограмм: S = a · h.\nРомб: S = d₁ · d₂ / 2.\nТрапеция: S = (a + b) / 2 · h.\nКвадрат: S = a², P = 4a."},{"id":"geo-circle","subject":"Геометрия","title":"Окружность и круг","text":"Диаметр d = 2r.\nДлина окружности C = 2πr.\nПлощадь круга S = πr².\nπ ≈ 3,14."},{"id":"geo-equal","subject":"Геометрия","title":"Признаки равенства треугольников","text":"1. По двум сторонам и углу между ними.\n2. По стороне и двум прилежащим к ней углам.\n3. По трём сторонам."},{"id":"geo-trig","subject":"Геометрия","title":"Синус, косинус, тангенс","text":"В прямоугольном треугольнике:\nsin α = противолежащий катет / гипотенуза\ncos α = прилежащий катет / гипотенуза\ntg α = противолежащий катет / прилежащий катет\nsin 30° = 1/2, cos 30° = √3/2\nsin 45° = cos 45° = √2/2, tg 45° = 1\nsin 60° = √3/2, cos 60° = 1/2"},{"id":"phys-mech","subject":"Физика","title":"Механика: основные формулы","text":"Скорость v = s / t, путь s = v · t.\nПлотность ρ = m / V.\nСила тяжести F = m · g, g ≈ 9,8 м/с² (в задачах часто 10).\nВторой закон Ньютона F = m · a.\nДавление p = F / S.\nДавление жидкости p = ρ · g · h.\nРабота A = F · s, мощность N = A / t.\n1 км/ч = 1 / 3,6 м/с."},{"id":"phys-el","subject":"Физика","title":"Электричество","text":"Закон Ома для участка цепи I = U / R.\nМощность тока P = U · I.\nРабота тока A = U · I · t.\nПоследовательное соединение: R = R₁ + R₂, ток один и тот же.\nПараллельное соединение: напряжение одно и то же, 1/R = 1/R₁ + 1/R₂."},{"id":"phys-heat","subject":"Физика","title":"Тепло","text":"Количество теплоты при нагревании Q = c · m · (t₂ − t₁).\nПри сгорании топлива Q = q · m.\nПри плавлении Q = λ · m."},{"id":"rus-ne","subject":"Русский","title":"НЕ с глаголами","text":"С глаголами НЕ пишется раздельно: не знаю, не пришёл.\nСлитно, если слово без НЕ не употребляется: ненавидеть, негодовать, недоумевать."},{"id":"rus-tsya","subject":"Русский","title":"-ТСЯ и -ТЬСЯ","text":"Задай вопрос к глаголу.\nЧто делать? Что сделать? отвечает инфинитив: -ТЬСЯ (учиться, умываться).\nЧто делает? Что сделает? отвечает форма 3-го лица: -ТСЯ (учится, умывается).\nПроверка: замени глагол на другой, например «делать»: делает, значит -ТСЯ."},{"id":"rus-vowel","subject":"Русский","title":"Безударные гласные в корне","text":"Проверяй ударением: измени слово так, чтобы гласная стала ударной (вода, воды, водный).\nСловарные слова не проверяются, их запоминают (ковёр, пассажир)."},{"id":"rus-comma","subject":"Русский","title":"Запятые","text":"Запятая нужна: между однородными членами без союза, перед союзами а, но, однако, зато, при обращении («Мама, иди сюда»), между частями сложного предложения.\nПеред союзом «и» между однородными членами запятая не нужна."},{"id":"rus-nn","subject":"Русский","title":"Н и НН в прилагательных","text":"Суффиксы -ан-, -ян-, -ин- пишутся с одной Н: кожаный, ветряной, гусиный.\nИсключения (пишутся с НН): стеклянный, оловянный, деревянный."},{"id":"chem-basic","subject":"Химия","title":"Основные величины","text":"Количество вещества n = m / M (моль = грамм : грамм на моль).\nЧисло Авогадро Nₐ = 6,02 · 10²³ моль⁻¹.\nМассовая доля ω = m(вещества) / m(раствора) · 100%.\nЗакон сохранения массы: масса веществ до реакции равна массе веществ после неё."},{"id":"hist-dates","subject":"История","title":"Даты по истории России","text":"862 — традиционная дата призвания варягов (Рюрик)\n988 — Крещение Руси\n1147 — первое упоминание Москвы\n1240 — Невская битва\n1242 — Ледовое побоище\n1380 — Куликовская битва\n1480 — стояние на реке Угре\n1613 — избрание на царство Михаила Романова\n1703 — основание Санкт-Петербурга\n1709 — Полтавская битва\n1812 — Отечественная война\n1861 — отмена крепостного права\n1941–1945 — Великая Отечественная война\n1961 — полёт Юрия Гагарина"}]};

window.KidData.guide = [{"id":"hw","title":"Как оформить домашнее задание","summary":"Сфотографируй, надиктуй или напиши задание — приложение оформит запись как в тетради.","steps":["Открой вкладку «ДЗ».","Нажми «Фото», «Галерея», «Голос» или «Стилус», либо просто напиши текст.","Проверь текст и поправь, если нужно.","Нажми «Записать как в тетради» или «Решить по шагам».","Сохрани: «В мои ДЗ», «Word» или «PDF»."],"keywords":["дз","домашка","домашнее","задание","фото","оформить","тетрадь","решить"],"route":"hw"},{"id":"tutor","title":"Подсказка, если не понимаю","summary":"Репетитор не даёт готовый ответ сразу, а подсказывает и объясняет.","steps":["Открой вкладку «Помощь».","Введи вопрос или задачу.","Выбери «Подсказка», «Объяснить» или «Что я забыл».","Выбери стиль: «Как другу», «Как в учебнике» или «Подробно»."],"keywords":["помощь","подсказка","объяснить","не понимаю","репетитор","забыл","учебник"],"route":"tutor"},{"id":"check","title":"Проверить своё решение","summary":"Приложение разберёт решение по строкам и покажет, где ошибка и как исправить.","steps":["Открой вкладку «Проверка».","Добавь задание и своё решение (фото, голос или текст).","Нажми «Проверить».","Зелёные строки верны, красные содержат ошибку. Под ними написано, что не так и как исправить.","Нажми «В тетрадь ошибок», чтобы потренироваться позже."],"keywords":["проверка","проверить","ошибка","решение","неверно","исправить"],"route":"check"},{"id":"visual","title":"График, чертёж, столбик, картинка","summary":"Рисунки строит само приложение, поэтому они точные.","steps":["Открой вкладку «Наглядно».","Выбери: «График», «Чертёж», «Столбик» или «Картинка».","График: введи формулу, например x^2-4x+3. Чертёж: введи стороны треугольника. Столбик: введи пример, например 1248:12.","Нажми «Построить», потом сохрани в Word или PDF."],"keywords":["график","чертёж","треугольник","столбик","деление","картинка","схема","наглядно","формула"],"route":"visual"},{"id":"pen","title":"Писать стилусом или пальцем","summary":"Рукописную запись приложение превращает в текст.","steps":["В «ДЗ», «Помощи» или «Проверке» нажми «Стилус».","Пиши на всём экране. Вверху выбери «Только стилус» или «Стилус и палец».","Инструменты: ручка, ластик, отмена, очистить.","Внизу нажми «Распознать запись» и прокрути вниз.","Исправь текст, если что-то распознано неверно."],"keywords":["стилус","рукописный","писать","ластик","распознать","палец"],"route":"hw"},{"id":"ar","title":"AR-линза: подписи поверх камеры","summary":"Наведи камеру, и ответ нарисуется поверх кадра.","steps":["Открой «Ещё» → «AR-линза» и разреши камеру. Быстрее: плитка «AR-линза» в шторке, ярлык на значке приложения или программируемая кнопка телефона (см. «Настройки»).","Выбери режим: «Всё вокруг» (здания, предметы, текст, формулы, QR и штрихкоды), «Задание» или «Тетрадь».","Наведи камеру на весь экран и нажми «Снять и разобрать».","Рамки с номерами появятся на снимке, а снизу подробное описание. Нажми на рамку или на строку, чтобы выделить её.","QR-коды и штрихкоды читаются сразу. Ссылки из QR сами не открываются: покажи их родителю.","Нажми на рамку: рядом всплывёт подсказка, а у здания или предмета появится кнопка «Историческая справка».","Снимок с подписями можно сохранить в Word или PDF."],"keywords":["ar","камера","линза","дополненная реальность","наведи","что это","тетрадь","рамки","qr","штрихкод","здание","достопримечательность"],"route":"ar"},{"id":"friend","title":"Спросить друга голосом","summary":"Друг отвечает голосом на любые вопросы.","steps":["Открой «Ещё» → «Спроси друга» или вызови его долгим нажатием кнопки питания.","Нажми на круг и говори.","Друг ответит голосом. Если нужно, скажи следующий вопрос.","Если на телефоне наушники, друг может отвечать только текстом: это настраивается в «Голос и кнопка»."],"keywords":["друг","голос","спросить","говорить","кнопка питания","ассистент"],"route":"friend"},{"id":"power","title":"Вызвать друга кнопкой питания","summary":"Нужно один раз выбрать приложение помощником по умолчанию.","steps":["Открой «Настройки» телефона → «Приложения» → «Приложения по умолчанию» → «Помощник и голосовой ввод».","Выбери «Помощник школьника».","Теперь долгое нажатие кнопки питания открывает друга.","Если на телефоне перестал работать голосовой ввод в других приложениях, в тех же настройках выбери службу распознавания речи Google."],"keywords":["кнопка питания","питание","по умолчанию","ассистент","не открывается","вызвать"],"route":"settings"},{"id":"notes","title":"Запомнить голосом: заметки","summary":"Скажи другу, что запомнить, и текст попадёт в «Заметки».","steps":["Скажи другу: «Запомни, завтра взять форму».","Друг подтвердит голосом.","Открой «Ещё» → «Заметки» и перечитай.","Скажи «Покажи заметки», и друг прочитает их вслух."],"keywords":["заметка","заметки","запомни","запомнить","записать"],"route":"memos"},{"id":"reminders","title":"Напоминания","summary":"Друг напомнит вовремя уведомлением со звуком.","steps":["Скажи: «Напомни через 10 минут покормить кота» или «Напомни завтра в 8 утра взять форму».","Или открой «Ещё» → «Напоминания» и нажми «Добавить».","Разреши уведомления, когда приложение попросит.","Скажи «Покажи напоминания», чтобы услышать список."],"keywords":["напоминание","напомни","будильник","уведомление","время"],"route":"reminders"},{"id":"save","title":"Сохранить в Word или PDF","summary":"Файлы можно сохранить и отправить.","steps":["Под результатом нажми «Word» или «PDF».","Файл сохранится в папку «Документы / Помощник» с именем вида «Иванов_7Б_...».","Кнопка «Поделиться» отправляет файл в мессенджер или на почту."],"keywords":["word","pdf","сохранить","файл","отправить","поделиться","документ"],"route":null},{"id":"profile","title":"Указать фамилию, имя и класс","summary":"Это попадает в шапку документов и помогает ИИ подстроиться под класс.","steps":["Открой «Ещё» → «Настройки».","Заполни «Фамилия и имя», «Класс» и «Буква».","ИИ получает только класс, а имя остаётся на телефоне."],"keywords":["фамилия","имя","класс","буква","профиль","настройки"],"route":"settings"},{"id":"mistakes","title":"Тетрадь ошибок и тренажёр","summary":"Ошибки собираются сами, по ним делаются тренировки.","steps":["Ошибки из «Проверки» попадают в «Тетрадь ошибок».","Открой «Тренажёр» и реши вопросы по своим ошибкам.","Ошибка считается выученной после трёх верных ответов подряд."],"keywords":["ошибки","тетрадь ошибок","тренажёр","тренировка","повторить"],"route":"mistakes"},{"id":"reading","title":"Что почитать и читать онлайн","summary":"Книги по твоему классу, советы по интересам и чтение в приложении.","steps":["Открой «Ещё» → «Чтение».","Выбери класс и «Программа» или «Для души».","Нажми на книгу, чтобы отметить прочитанной, или на «Читать онлайн», чтобы открыть текст.","Листай «Назад» и «Дальше», меняй размер букв кнопками A− и A+, нажми «Слушать», чтобы текст прочитали вслух.","«Объяснить страницу» расскажет, о чём она, и пояснит трудные слова. Закладка сохраняется сама.","Читаются книги без авторских прав, в основном классика. Современные авторы только в библиотеке. Если страница не грузится, смотри подсказку про VPN."],"keywords":["чтение","книги","читать","онлайн","электронная","викитека","список литературы","литература","что почитать","закладка"],"route":"reading"},{"id":"assigned","title":"Определить, что задано","summary":"Предметы, задания и учебники по записи из дневника.","steps":["Открой «Ещё» → «Что задано».","Сфотографируй запись или напиши текст.","Нажми «Определить предметы и учебники».","Заполни «Мои учебники», чтобы название подставлялось само."],"keywords":["что задано","дневник","предмет","учебник","задание","пособие"],"route":"assigned"},{"id":"history","title":"Историческая справка","summary":"Справка из интернета про здание, место или событие.","steps":["Открой «Ещё» → «Историческая справка» и напиши, что искать.","Или в AR-линзе нажми на подпись здания и выбери «Историческая справка».","Если сайт не открывается, приложение подскажет, включить или выключить VPN. VPN включает родитель.","Нажми «Объяснить проще», чтобы получить короткий пересказ."],"keywords":["история","справка","википедия","интернет","vpn","впн","поиск","здание"],"route":"history"},{"id":"quickar","title":"Быстро открыть AR-линзу","summary":"Камера без поиска по приложению: плитка, ярлык или кнопка телефона.","steps":["Плитка: потяни шторку, нажми карандаш и перетащи плитку «AR-линза».","Ярлык: долго нажми на значок приложения и выбери «AR-линза».","Отдельный значок «AR-линза» есть в списке приложений.","Программируемая кнопка: Samsung — Настройки → Дополнительные функции → Боковая кнопка; Xiaomi — Дополнительные настройки → Жесты → Запуск функции; другие — приложение Button Mapper. Выбери «Открыть приложение» → «AR-линза»."],"keywords":["кнопка","быстро","плитка","ярлык","bixby","боковая","button mapper","программируемая","запуск камеры"],"route":"settings"},{"id":"vpn","title":"Сайт не открывается: нужен ли VPN","summary":"Справка и чтение берутся из интернета. Приложение подсказывает про VPN.","steps":["Если появилась жёлтая плашка «Включи VPN», попроси родителя включить VPN и повтори.","Если плашка говорит «Выключи VPN», выключи его и повтори.","Если интернета нет совсем, включи Wi-Fi или мобильные данные.","Сам VPN приложение не включает: это делает родитель в настройках телефона."],"keywords":["vpn","впн","не открывается","не грузится","интернет","блокировка","нет связи"],"route":"history"},{"id":"location","title":"Где ребёнок","summary":"Родитель узнаёт место по SMS «где ты». Ребёнок об этом знает.","steps":["Родитель открывает «Ещё» → «Для родителя», вводит PIN, указывает свой номер и включает «Отвечать на запрос родителя».","На телефоне ребёнка нужно выдать геолокацию, приём SMS и работу в фоне «Всегда».","Родитель шлёт SMS «где ты» со своего номера и получает ссылку на карту.","При каждой отправке у ребёнка появляется уведомление, список отправок виден в приложении."],"keywords":["где ребёнок","геолокация","местоположение","карта","где ты","sms","смс"],"route":"parent"},{"id":"pc","title":"Работать на компьютере","summary":"Веб-версия открывается в браузере, обменивается данными с телефоном через GitHub и подчиняется тем же правилам родителя.","steps":["Родитель один раз настраивает: адрес сайта и частный репозиторий для данных описаны в README, раздел «Версия для компьютера».","На телефоне: «Ещё» → «Для родителя» → «Компьютер: общие данные через GitHub», введи репозиторий и токен. На компьютере то же самое в «Настройках», плюс ключ ИИ.","Тетрадь ошибок, заметки, прогресс и профиль одинаковые на обоих устройствах.","Родитель может управлять и с компьютера: «Ещё» → «Для родителя», вход по тому же PIN. Там включаются и выключаются любые разделы, режимы «Только подсказки» и «Только работа над ошибками», учебные часы и лимит времени.","Правила, изменённые на одном устройстве, появляются на другом после синхронизации (телефон принимает их только с верным PIN).","На компьютере закрытый родителем раздел исчезает. Когда время или лимит вышли, показывается экран отдыха, снять его можно PIN-кодом родителя на 30 минут."],"keywords":["компьютер","пк","ноутбук","браузер","сайт","веб","синхронизация","github","гитхаб","windows","с компьютера"],"route":"parent"},{"id":"exam","title":"Подготовиться к контрольной","summary":"Приложение составит план по дням.","steps":["Открой «Ещё» → «К контрольной».","Укажи предмет, тему и дату.","Получи план по дням и выполняй задания каждый день."],"keywords":["контрольная","экзамен","подготовка","план","тест"],"route":"exam"},{"id":"parent","title":"Для родителя","summary":"Ограничения, PIN и уведомление родителю по SMS.","steps":["Открой «Ещё» → «Для родителя» и введи PIN. Сначала задай PIN, иначе правила не действуют.","Учебные часы и лимит времени в день закроют приложение экраном отдыха. Родитель разрешает ещё 30 минут по PIN.","Любой раздел можно выключить переключателем: вкладки внизу и всё в «Ещё». Кнопка «Только работа над ошибками» оставит проверку по фото, тетрадь ошибок и тренажёр. Ещё есть режим « window.KidData.guideAi = "Приложение «Помощник школьника». Вкладки: ДЗ, Помощь, Проверка, Наглядно, Ещё.\n- Как оформить домашнее задание: Сфотографируй, надиктуй или напиши задание — приложение оформит запись как в тетради. Открой вкладку «ДЗ». Нажми «Фото», «Галерея», «Голос» или «Стилус», либо просто напиши текст. Проверь текст и поправь, если нужно. Нажми «Записать как в тетради» или «Решить по шагам». Сохрани: «В мои ДЗ», «Word» или «PDF».\n- Подсказка, если не понимаю: Репетитор не даёт готовый ответ сразу, а подсказывает и объясняет. Открой вкладку «Помощь». Введи вопрос или задачу. Выбери «Подсказка», «Объяснить» или «Что я забыл». Выбери стиль: «Как другу», «Как в учебнике» или «Подробно».\n- Проверить своё решение: Приложение разберёт решение по строкам и покажет, где ошибка и как исправить. Открой вкладку «Проверка». Добавь задание и своё решение (фото, голос или текст). Нажми «Проверить». Зелёные строки верны, красные содержат ошибку. Под ними написано, что не так и как исправить. Нажми «В тетрадь ошибок», чтобы потренироваться позже.\n- График, чертёж, столбик, картинка: Рисунки строит само приложение, поэтому они точные. Открой вкладку «Наглядно». Выбери: «График», «Чертёж», «Столбик» или «Картинка». График: введи формулу, например x^2-4x+3. Чертёж: введи стороны треугольника. Столбик: введи пример, например 1248:12. Нажми «Построить», потом сохрани в Word или PDF.\n- Писать стилусом или пальцем: Рукописную запись приложение превращает в текст. В «ДЗ», «Помощи» или «Проверке» нажми «Стилус». Пиши на всём экране. Вверху выбери «Только стилус» или «Стилус и палец». Инструменты: ручка, ластик, отмена, очистить. Внизу нажми «Распознать запись» и прокрути вниз. Исправь текст, если что-то распознано неверно.\n- AR-линза: подписи поверх камеры: Наведи камеру, и ответ нарисуется поверх кадра. Открой «Ещё» → «AR-линза» и разреши камеру. Быстрее: плитка «AR-линза» в шторке, ярлык на значке приложения или программируемая кнопка телефона (см. «Настройки»). Выбери   Kid.readPhoto = function (file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('Не удалось прочитать файл.')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('Это не картинка.')); };
        img.onload = function () {
          var k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/jpeg', 0.85));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  };

  // ---------- вёрстка ----------
  Kid.chips = function (list, cur, act) { return '<div class="chips">' + list.map(function (s) { return '<button data-act="' + act + '" data-v="' + esc(s) + '" class="' + (s === cur ? 'on' : '') + '">' + esc(s) + '</button>'; }).join('') + '</div>'; };
  Kid.head = function (t, s) { return '<h2>' + esc(t) + '</h2>' + (s ? '<p class="sub">' + esc(s) + '</p>' : ''); };
  Kid.busy = function (t) { return '<p class="mut"><span class="spin"></span>' + esc(t) + '</p>'; };
  Kid.photoBox = function (p, act, label) {
    return '<label>' + esc(label || 'Фото (можно вместо текста)') + '</label><input type="file" accept="image/*" capture="environment" data-act="' + act + '">' +
      (p ? '<img class="photo" src="' + p + '" alt="Фото"><button class="b o" data-act="' + act + 'Clear">Убрать фото</button>' : '');
  };
  Kid.textarea = function (bind, value, label) { return (label ? '<label>' + esc(label) + '</label>' : '') + '<textarea data-bind="' + bind + '">' + esc(value) + '</textarea>'; };
  Kid.input = function (bind, value, label, type) { return (label ? '<label>' + esc(label) + '</label>' : '') + '<input' + (type ? ' type="' + type + '"' : '') + ' data-bind="' + bind + '" value="' + esc(value) + '">'; };
  Kid.err = function (t) { return t ? '<p class="err">' + esc(t) + '</p>' : ''; };

  // ---------- файлы, печать, голос ----------
  // Скачать текстовый файл: Kid.download('реферат.doc', 'application/msword', html)
  Kid.download = function (name, mime, content) {
    var a = document.createElement('a'), url = URL.createObjectURL(new Blob([content], { type: mime + ';charset=utf-8' }));
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 1000);
  };
  // Word откроет HTML с расширением .doc: Kid.saveWord('Реферат', '<h1>..</h1><p>..</p>')
  Kid.saveWord = function (title, bodyHtml) {
    Kid.download(title.replace(/[\\/:*?"<>|]+/g, '_') + '.doc', 'application/msword',
      '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(title) + '</title></head><body style="font-family:Times New Roman;font-size:14pt">' + bodyHtml + '</body></html>');
  };
  // Печать или «Сохранить как PDF»: Kid.printHtml('Реферат', '<h1>..</h1>')
  Kid.printHtml = function (title, bodyHtml) {
    var w = window.open('', '_blank'); if (!w) return false;
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>body{font:14pt/1.4 "Times New Roman",serif;margin:2cm}h1,h2{font-weight:700}pre{white-space:pre-wrap;font:inherit}</style></head><body>' + bodyHtml + '</body></html>');
    w.document.close(); w.focus(); setTimeout(function () { w.print(); }, 300); return true;
  };
  // Озвучка: Kid.speak('текст', function () { /* закончили */ }); Kid.stopSpeak()
  Kid.speak = function (text, onEnd) {
    if (!window.speechSynthesis) { if (onEnd) onEnd(); return false; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = 'ru-RU'; u.onend = u.onerror = function () { if (onEnd) onEnd(); };
    window.speechSynthesis.speak(u); return true;
  };
  Kid.stopSpeak = function () { if (window.speechSynthesis) window.speechSynthesis.cancel(); };
  // Голосовой ввод (Chrome, Edge): Kid.canListen(); Kid.listen(function (text) {...}, function () { /* конец */ })
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  Kid.canListen = function () { return !!Rec; };
  Kid.listen = function (onText, onEnd) {
    if (!Rec) { if (onEnd) onEnd('Голосовой ввод не поддерживается этим браузером. Используй Chrome или Edge.'); return null; }
    var r = new Rec(); r.lang = 'ru-RU'; r.interimResults = false; r.maxAlternatives = 1;
    r.onresult = function (e) { var t = ''; for (var i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript; onText(t.trim()); };
    r.onerror = function (e) { if (onEnd) onEnd(e.error === 'not-allowed' ? 'Разреши браузеру доступ к микрофону.' : 'Не расслышал, попробуй ещё раз.'); onEnd = null; };
    r.onend = function () { if (onEnd) onEnd(); };
    r.start(); return r;
  };

  // ---------- реестр разделов ----------
  // Kid.register({ key, title, subtitle?, icon?, view: function () { return html; }, acts: { name: function (v, el) {} }, always?: true })
  Kid.register = function (def) {
    if (!def || !def.key || typeof def.view !== 'function') throw new Error('register: нужны key и view');
    Kid.sections = Kid.sections.filter(function (s) { return s.key !== def.key; });
    Kid.sections.push(def);
    Object.keys(def.acts || {}).forEach(function (n) { Kid.acts[n] = def.acts[n]; });
  };
  function find(key) { return Kid.sections.filter(function (s) { return s.key === key; })[0]; }
  Kid.section = find;

  // ---------- синхронизация через GitHub ----------
  function enc(str) { var b = new TextEncoder().encode(str), s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
  function dec(b64) { var s = atob(b64.replace(/\s/g, '')), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return new TextDecoder().decode(b); }
  function gh(path, method, body) {
    return fetch('https://api.github.com/repos/' + settings.repo + path, {
      method: method || 'GET', headers: { Authorization: 'Bearer ' + settings.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, body: body ? JSON.stringify(body) : undefined,
    });
  }
  function ghExplain(code) {
    return code === 401 ? 'GitHub не принял токен. Проверь, что он скопирован целиком и не истёк.'
      : code === 403 ? 'У токена нет прав на запись. Нужен доступ «Contents: Read and write» к репозиторию.'
      : code === 404 ? 'Репозиторий не найден. Проверь адрес вида имя/репозиторий и что токен выдан на этот репозиторий.' : 'Ошибка GitHub (' + code + ').';
  }
  Kid.syncConfigured = function () { return /^[\w.-]+\/[\w.-]+$/.test(settings.repo || '') && !!settings.token; };

  function syncOnce() {
    return gh('/contents/data.json').then(function (r) {
      if (r.status === 404) return gh('').then(function (rr) { if (rr.status !== 200) throw new Error(ghExplain(rr.status)); return { snap: S.emptySnap(), sha: null }; });
      if (r.status < 200 || r.status > 299) throw new Error(ghExplain(r.status));
      return r.json().then(function (o) {
        var text = dec(o.content || ''), snap = S.emptySnap();
        if (text.trim()) { try { snap = S.fromWire(JSON.parse(text)); } catch (e) { snap = null; } if (!snap) throw new Error('Файл data.json в репозитории повреждён или чужой.'); }
        return { snap: snap, sha: o.sha };
      });
    }).then(function (remote) {
      var merged = S.mergeSnap(state, remote.snap, Date.now());
      Object.assign(state, merged); Kid.persist();
      if (S.sameSnap(merged, remote.snap)) return { done: 'Всё актуально.' };
      var body = { message: 'sync from computer', content: enc(JSON.stringify(S.toWire(merged))) };
      if (remote.sha) body.sha = remote.sha;
      return gh('/contents/data.json', 'PUT', body).then(function (r) {
        if (r.status >= 200 && r.status < 300) return { done: 'Готово: данные обновлены.' };
        if (r.status === 409 || r.status === 422) return { retry: true };
        throw new Error(ghExplain(r.status));
      });
    });
  }
  Kid.syncNow = function (silent) {
    if (!Kid.syncConfigured() || ui.sync.busy) return Promise.resolve();
    ui.sync.busy = true; if (!silent) Kid.render();
    var attempt = 0;
    function go() { attempt++; return syncOnce().then(function (res) { if (res.retry && attempt < 3) return go(); if (res.retry) throw new Error('Файл меняли одновременно, попробуй ещё раз.'); return res.done; }); }
    return go().then(function (m) { ui.sync.msg = m; ui.sync.ok = true; settings.last = Date.now(); Kid.persistSettings(); }, function (e) {
      ui.sync.ok = false; ui.sync.msg = (e instanceof TypeError) ? 'Нет связи с GitHub. Проверь интернет.' : e.message;
    }).then(function () { ui.sync.busy = false; Kid.render(); });
  };
  Kid.syncSoon = function () { Kid.persist(); Kid.syncNow(true); };

  // ---------- родитель: вход, правила, блокировка ----------
  var parentSession = { key: null, until: 0 };
  Kid.parentLoggedIn = function () { return !!parentSession.key && Date.now() < parentSession.until; };
  Kid.parentLogout = function () { parentSession.key = null; parentSession.until = 0; };
  Kid.parentHasPin = function () { return !!(state.parent && state.parent.sig); };
  // Проверка PIN по подписи правил, пришедших с телефона. Сам PIN нигде не хранится.
  Kid.parentLogin = function (pin) {
    if (!Kid.parentHasPin()) return Promise.reject(new Error('Правил родителя ещё нет. На телефоне задай PIN в «Для родителя» и синхронизируй, затем повтори здесь.'));
    return P.deriveKey(pin).then(function (key) {
      return P.verify(state.parent, key).then(function (ok) {
        if (!ok) throw new Error('Неверный PIN.');
        parentSession.key = key; parentSession.until = Date.now() + 15 * 60 * 1000;
      });
    });
  };
  // Сохранить новые правила (нужен вход родителя). Телефон применит их после проверки подписи.
  Kid.setParentCore = function (core) {
    if (!Kid.parentLoggedIn()) return Promise.reject(new Error('Сначала войди как родитель.'));
    parentSession.until = Date.now() + 15 * 60 * 1000;
    return P.makeRec(core, parentSession.key).then(function (rec) { state.parent = rec; Kid.syncSoon(); Kid.render(); });
  };
  // Снять блокировку на 30 минут по PIN (экран отдыха)
  Kid.parentOverride = function (pin) {
    return Kid.parentLogin(pin).then(function () { save('kid.override', Date.now() + 30 * 60 * 1000); });
  };
  function overrideActive() { return load('kid.override', 0) > Date.now(); }

  // Учёт времени: секунды, пока вкладка видна
  var usage = load('kid.usage', { day: '', sec: 0 });
  if (usage.day !== Kid.today()) usage = { day: Kid.today(), sec: 0 };
  Kid.usedSec = function () { return usage.day === Kid.today() ? usage.sec : 0; };
  function lockReason() {
    var c = Kid.parentCore(); if (!c || !Kid.parentHasPin()) return null;
    var now = new Date();
    return P.lockReason(c, now.getHours() * 60 + now.getMinutes(), Kid.usedSec(), overrideActive());
  }
  Kid.lockReason = lockReason;
  // автосинхронизация: раз в 2 минуты, пока вкладка открыта, и сразу при возвращении на вкладку
  setInterval(function () { if (!document.hidden) Kid.syncNow(true); }, 120000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) Kid.syncNow(true); });
  var lastTick = Date.now(), lastLocked = null;
  setInterval(function () {
    var now = Date.now(), dt = Math.min(10, (now - lastTick) / 1000); lastTick = now;
    if (document.hidden) return;
    if (usage.day !== Kid.today()) usage = { day: Kid.today(), sec: 0 };
    if (!lockReason()) {
      usage.sec += dt; save('kid.usage', usage);
      var min = Math.ceil(usage.sec / 60);
      state.usage.pc = state.usage.pc || {};
      if ((state.usage.pc[usage.day] || 0) < min) { state.usage.pc[usage.day] = min; if (min % 5 === 0) Kid.persist(); }
    }
    var r = lockReason();
    if (r !== lastLocked) { lastLocked = r; Kid.render(); }
  }, 5000);

  // ---------- отрисовка ----------
  function visibleSections() { return Kid.sections.filter(function (s) { return (Kid.ALWAYS[s.key] || !Kid.blocked(s.key)) && !(s.key === 'parent' && Kid.gate && Kid.gate.isChild()); }); }
  function renderLock() {
    var r = lockReason(), el = document.getElementById('lock');
    if (!r) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'lock'; document.body.appendChild(el); }
    if (el.getAttribute('data-r') === r && el.querySelector('input')) return;   // не сбиваем ввод PIN
    el.setAttribute('data-r', r);
    el.innerHTML = '<div class="lockbox"><h2>Пора отдохнуть</h2><p>' + esc(P.lockMessage(r, Kid.parentCore())) + '</p><label>PIN родителя</label><input id="lockpin" type="password" inputmode="numeric" autocomplete="off"><button class="b" id="lockbtn">Разрешить ещё 30 минут</button><p class="err" id="lockerr"></p></div>';
    el.querySelector('#lockbtn').onclick = function () {
      var pin = el.querySelector('#lockpin').value;
      Kid.parentOverride(pin).then(function () { Kid.render(); }, function (e) { el.querySelector('#lockerr').textContent = e.message; });
    };
  }

  Kid.render = function () {
    if (Kid.gate && Kid.gate.show()) return;   // не вошли: показываем только форму входа
    var vis = visibleSections(), keys = vis.map(function (s) { return s.key; });
    if (!find(ui.view) && ui.view !== 'more') ui.view = 'check';
    if (ui.view !== 'more' && !Kid.ALWAYS[ui.view] && Kid.blocked(ui.view)) ui.view = (MAIN.filter(function (k) { return keys.indexOf(k) >= 0; })[0]) || 'more';
    var tabs = MAIN.filter(function (k) { return keys.indexOf(k) >= 0; }).map(function (k) { return [k, find(k).title]; }).concat([['more', 'Ещё']]);
    var active = MAIN.indexOf(ui.view) >= 0 ? ui.view : 'more';
    document.getElementById('tabs').innerHTML = tabs.map(function (t) { return '<button data-act="go" data-v="' + t[0] + '" class="' + (t[0] === active ? 'on' : '') + '">' + esc(t[1]) + '</button>'; }).join('');
    var html;
    if (ui.view === 'more') {
      html = Kid.head('Ещё', 'Всё для учёбы в одном месте') + '<div class="grid">' + vis.filter(function (s) { return MAIN.indexOf(s.key) < 0; }).map(function (s) {
        return '<button class="tile" data-act="go" data-v="' + esc(s.key) + '"><b>' + esc(s.title) + '</b><span>' + esc(s.subtitle || '') + '</span></button>';
      }).join('') + '</div>' + (Kid.gate && Kid.gate.active() ? '<div class="row" style="margin-top:12px"><button class="b o" data-act="gateLogout">Выйти из аккаунта (' + esc(Kid.gate.who()) + ')</button></div>' : '');
    } else {
      var sec = find(ui.view), back = MAIN.indexOf(ui.view) >= 0 ? '' : '<button class="b o back" data-act="go" data-v="more">← Ещё</button>';
      try { html = back + sec.view(); } catch (e) { html = back + '<p class="err">Ошибка раздела: ' + esc(e.message) + '</p>'; }
    }
    document.getElementById('view').innerHTML = html;
    renderLock();
  };

  // ---------- действия ----------
  Kid.acts.gateLogout = function () { Kid.gate.logout(); Kid.parentLogout(); };
  Kid.acts.go = function (v) { ui.view = v; save('kid.view', v); window.scrollTo(0, 0); };

  function setBind(path, v) {
    var p = path.split('.'), o = ui;
    for (var i = 0; i < p.length - 1; i++) { if (o[p[i]] == null || typeof o[p[i]] !== 'object') o[p[i]] = {}; o = o[p[i]]; }
    o[p[p.length - 1]] = v;
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
    var name = el.getAttribute('data-act'), a = Kid.acts[name]; if (!a) return;
    var res; try { res = a(el.getAttribute('data-v'), el, e); } catch (err) { console.error(err); }
    Promise.resolve(res).then(Kid.render, function (err) { console.error(err); Kid.render(); });
    Kid.render();
  });
  document.addEventListener('change', function (e) {
    var el = e.target; if (!el.getAttribute) return;
    var name = el.getAttribute('data-act');
    if (name && el.tagName === 'INPUT' && el.type === 'file' && el.files && el.files[0] && Kid.acts[name]) { Promise.resolve(Kid.acts[name](null, el, e)).then(Kid.render); return; }
    if (name && el.tagName === 'SELECT' && Kid.acts[name]) { Promise.resolve(Kid.acts[name](el.value, el, e)).then(Kid.render); return; }
    if (name && el.tagName === 'INPUT' && el.type === 'checkbox' && Kid.acts[name]) { Promise.resolve(Kid.acts[name](el.getAttribute('data-v'), el, e)).then(Kid.render); }
  });
  document.addEventListener('input', function (e) { var b = e.target.getAttribute && e.target.getAttribute('data-bind'); if (b) setBind(b, e.target.value); });

  Kid.start = function () {
    Kid.touchToday(); Kid.persist(); Kid.render();
    if (Kid.syncConfigured()) Kid.syncNow(true);
  };
})();

</script>
<script>
// Экран входа по логину и паролю. Сессия живёт, пока открыта вкладка (sessionStorage).
// Это защита от случайного доступа: сайт статический, поэтому злонамеренный человек с инструментами браузера её обойдёт.
(function () {
  'use strict';
  var Kid = window.Kid, A = window.KidAuth, P = window.KidParent, esc = Kid.esc, state = Kid.state;
  var g = { mode: 'login', msg: '', sig: '' };
  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { /* нет хранилища */ } return null; }
  function accounts() { return A.live(state.accounts); }
  function session() { var l = ss('kid.session'); if (!l) return null; var r = A.find(state.accounts, l); return r ? r : null; }
  function hasAny() { return accounts().length > 0; }
  var api = Kid.gate = {};
  api.active = function () { return hasAny() && !!session(); };
  api.who = function () { var r = session(); return r ? r.login : ''; };
  api.isChild = function () { var r = session(); return !!(r && r.role === 'child'); };
  api.logout = function () { ss('kid.session', null); Kid.render(); };
  // Попытки: после 5 ошибок подряд пауза 30 секунд
  function lockedFor() { var u = parseInt(ss('kid.failUntil') || '0', 10); return Math.max(0, Math.ceil((u - Date.now()) / 1000)); }
  function fail() { var n = parseInt(ss('kid.fails') || '0', 10) + 1; ss('kid.fails', String(n)); if (n >= 5) { ss('kid.fails', '0'); ss('kid.failUntil', String(Date.now() + 30000)); } }
  function enter(rec) { ss('kid.fails', '0'); ss('kid.session', rec.login); g.msg = ''; g.mode = 'login'; Kid.render(); }
  function setMsg(t) { g.msg = t; g.sig = ''; Kid.render(); }

  function field(id, label, type, val) { if (!val && type !== 'password' && g.keep && g.keep[id]) val = g.keep[id]; return '<label>' + esc(label) + '</label><input id="' + id + '" type="' + (type || 'text') + '" autocomplete="off" value="' + esc(val || '') + '">'; }
  function html() {
    var m = g.mode, h = '<div class="lockbox">';
    if (m === 'setup') {
      h += '<h2>Первый вход</h2><p class="mut">Придумайте логин и пароль родителя. Потом в разделе «Для родителя» можно добавить вход для ребёнка.</p>' + field('gl', 'Логин родителя', 'text') + field('gp', 'Пароль (не короче 6 символов)', 'password') + field('gp2', 'Пароль ещё раз', 'password') +
        '<button class="b" id="gok">Создать и войти</button><p><a href="#" id="glink1">Уже есть семья на телефоне или другом компьютере: подключиться</a></p>';
    } else if (m === 'connect') {
      h += '<h2>Подключить к семье</h2><p class="mut">Нужны репозиторий и токен GitHub из настроек синхронизации на телефоне. После подключения логины подтянутся сами.</p>' + field('gr', 'Репозиторий, например ivan/kid-sync', 'text', Kid.settings.repo) + field('gt', 'Токен GitHub', 'password') +
        '<button class="b" id="gok">Подключить</button><p><a href="#" id="glink2">Назад</a></p>';
    } else if (m === 'reset') {
      h += '<h2>Забыли пароль</h2><p class="mut">Нужен PIN родителя (тот же, что на телефоне). Можно задать новый пароль для любого логина.</p>' + field('gl', 'Логин', 'text') + field('gpin', 'PIN родителя', 'password') + field('gp', 'Новый пароль', 'password') +
        '<button class="b" id="gok">Сменить пароль и войти</button><p><a href="#" id="glink2">Назад</a></p>';
    } else {
      h += '<h2>Вход</h2>' + field('gl', 'Логин', 'text') + field('gp', 'Пароль', 'password') + '<button class="b" id="gok">Войти</button>' +
        '<p><a href="#" id="glink3">Забыли пароль</a></p>';
    }
    return h + (g.msg ? '<p class="err">' + esc(g.msg) + '</p>' : '') + '</div>';
  }
  function val(id) { var e = document.getElementById(id); return e ? e.value : ''; }

  function doLogin() {
    var w = lockedFor(); if (w) return setMsg('Слишком много попыток. Подождите ' + w + ' с.');
    var rec = A.find(state.accounts, val('gl')), pw = val('gp');
    if (!rec) { fail(); return setMsg('Неверный логин или пароль.'); }
    A.verify(rec, pw).then(function (ok) { if (ok) enter(rec); else { fail(); setMsg('Неверный логин или пароль.'); } });
  }
  function doSetup() {
    var l = val('gl'), p = val('gp'), e = A.checkLogin(l) || A.checkPassword(p) || (p !== val('gp2') ? 'Пароли не совпадают.' : '');
    if (e) return setMsg(e);
    A.make(l, 'parent', p, Date.now()).then(function (rec) { window.KidSync.put(state.accounts, rec, rec.updated); Kid.syncSoon(); enter(rec); });
  }
  function doConnect() {
    Kid.settings.repo = val('gr').trim(); Kid.settings.token = val('gt').trim(); Kid.persistSettings();
    if (!Kid.syncConfigured()) return setMsg('Проверьте репозиторий и токен.');
    g.msg = 'Подключаюсь…'; g.sig = ''; Kid.render();
    Kid.syncNow(true).then(function () {
      g.mode = hasAny() ? 'login' : 'setup';
      g.msg = hasAny() ? 'Готово. Войдите.' : 'Подключено, но логинов пока нет: создайте первый.'; g.sig = ''; Kid.render();
    });
  }
  function doReset() {
    var rec = A.find(state.accounts, val('gl')), e = A.checkPassword(val('gp'));
    if (!rec) return setMsg('Такого логина нет.'); if (e) return setMsg(e);
    var w = lockedFor(); if (w) return setMsg('Слишком много попыток. Подождите ' + w + ' с.');
    if (!Kid.parentHasPin()) return setMsg('PIN родителя ещё не пришёл с телефона. Синхронизируйте телефон.');
    P.deriveKey(val('gpin')).then(function (key) { return P.verify(state.parent, key); }).then(function (ok) {
      if (!ok) { fail(); return setMsg('Неверный PIN.'); }
      return A.make(rec.login, rec.role, val('gp'), Date.now()).then(function (n) { window.KidSync.put(state.accounts, n, n.updated); Kid.syncSoon(); enter(n); });
    });
  }
  var ACT = { login: doLogin, setup: doSetup, connect: doConnect, reset: doReset };

  // true, если показана форма (интерфейс закрыт)
  api.show = function () {
    var el = document.getElementById('gate');
    var need = !hasAny() || !session();
    if (!need) { if (el) el.remove(); return false; }
    if (!hasAny() && g.mode !== 'connect' && g.mode !== 'setup') g.mode = 'setup';
    if (hasAny() && (g.mode === 'setup')) g.mode = 'login';
    var sig = g.mode + '|' + g.msg;
    if (!el) { el = document.createElement('div'); el.id = 'gate'; document.body.appendChild(el); g.sig = ''; }
    if (g.sig !== sig) {          // перерисовываем только при смене режима или сообщения, чтобы не стирать ввод
      g.keep = {}; ['gl', 'gr'].forEach(function (i) { var e = el.querySelector('#' + i); if (e) g.keep[i] = e.value; });   // логин не стираем при ошибке, пароль стираем
      g.sig = sig; el.innerHTML = html();
      var go = el.querySelector('#gok'); if (go) go.onclick = ACT[g.mode];
      el.querySelectorAll('input').forEach(function (i) { i.onkeydown = function (e) { if (e.key === 'Enter') ACT[g.mode](); }; });
      [['glink1', 'connect'], ['glink2', hasAny() ? 'login' : 'setup'], ['glink3', 'reset']].forEach(function (x) { var a = el.querySelector('#' + x[0]); if (a) a.onclick = function (e) { e.preventDefault(); g.mode = x[1]; g.msg = ''; Kid.render(); }; });
    }
    return true;
  };
  // Управление аккаунтами (для раздела «Для родителя»)
  api.list = accounts;
  api.add = function (login, role, pw) {
    var e = A.checkLogin(login) || A.checkPassword(pw); if (e) return Promise.reject(new Error(e));
    return A.make(login, role, pw, Date.now()).then(function (rec) { window.KidSync.put(state.accounts, rec, rec.updated); Kid.syncSoon(); });
  };
  api.remove = function (login) {
    var rec = A.find(state.accounts, login); if (!rec) return;
    var parents = accounts().filter(function (r) { return r.role === 'parent' && r.login !== rec.login; });
    if (rec.role === 'parent' && !parents.length) throw new Error('Нельзя удалить последний вход родителя.');
    window.KidSync.remove(state.accounts, rec.id, Date.now()); Kid.syncSoon();
  };
})();

<script>
// Проверка, Помощь, Тетрадь ошибок, Тренажёр, Прогресс, Настройки.
(function () {
  'use strict';
  var Kid = window.Kid, S = window.KidSync, C = window.KidCheck, esc = Kid.esc, ui = Kid.ui, state = Kid.state, settings = Kid.settings;
  var SUBJ = Kid.SUBJECTS;
  var c = Kid.mod('check', { subject: 'Математика', task: '', solution: '', photo: null, busy: false, error: '', raw: '', parsed: null, info: '' });
  var t = Kid.mod('tutor', { subject: 'Математика', q: '', photo: null, busy: false, error: '', answer: '' });
  var tr = Kid.mod('trainer', { idx: 0, answer: '', shown: false, verdict: '' });

  // Кнопка рукописного ввода появляется, если раздел «Наглядно» подключил Kid.hand
  function hand(act) { return Kid.hand ? '<button class="b o" data-act="' + act + '">✍ Написать от руки</button>' : ''; }
  function vCheck() {
    var p = c.parsed, h = Kid.head('Проверка', 'Найду ошибку и покажу, как исправить');
    h += '<div class="card">' + Kid.chips(SUBJ, c.subject, 'cSubject') + Kid.textarea('check.task', c.task, 'Задание (можно не заполнять)') + Kid.textarea('check.solution', c.solution, 'Моё решение') + hand('cHand') +
      Kid.photoBox(c.photo, 'cPhoto') + '<button class="b" data-act="cGo"' + (c.busy ? ' disabled' : '') + '>Проверить</button></div>';
    if (c.busy) h += Kid.busy('Проверяю…');
    h += Kid.err(c.error);
    if (c.raw && !p) h += '<div class="card"><pre>' + esc(c.raw) + '</pre></div>';
    if (p) {
      h += '<div class="card ' + (p.allCorrect ? 'good' : 'bad') + '"><b>' + (p.allCorrect ? 'Всё верно!' : 'Ошибок: ' + p.errorCount) + '</b>' + (p.summary ? '<p>' + esc(p.summary) + '</p>' : '') + '</div>';
      p.lines.forEach(function (l) {
        var cls = l.status === 'error' ? 'bad' : l.status === 'consequence' ? 'warn' : 'okl', tag = l.status === 'error' ? ['e', 'ОШИБКА'] : l.status === 'consequence' ? ['c', 'СЛЕДСТВИЕ'] : ['o', 'ВЕРНО'];
        h += '<div class="card ' + cls + '"><span class="tag ' + tag[0] + '">' + tag[1] + '</span><pre>' + esc(l.text) + '</pre>' + (l.why ? '<div>Что не так: ' + esc(l.why) + '</div>' : '') + (l.fix ? '<div><b>Как исправить: ' + esc(l.fix) + '</b></div>' : '') + '</div>';
      });
      if (p.correct && !Kid.hintOnly()) h += '<div class="card"><b>Верное решение</b><pre>' + esc(p.correct) + '</pre></div>';
      if (p.errorCount > 0) h += '<button class="b t" data-act="cSave">В тетрадь ошибок</button>';
      if (c.info) h += '<p class="okt">' + esc(c.info) + '</p>';
    }
    return h;
  }
  function vTutor() {
    var h = Kid.head('Помощь', 'Подскажу и объясню, но не решу за тебя'), d = t.busy ? ' disabled' : '';
    h += '<div class="card">' + Kid.chips(SUBJ, t.subject, 'tSubject') + Kid.textarea('tutor.q', t.q, 'Что непонятно?') + hand('tHand') + Kid.photoBox(t.photo, 'tPhoto') +
      '<div class="row"><button class="b" data-act="tGo" data-v="hint"' + d + '>Подсказка</button><button class="b t" data-act="tGo" data-v="forgot"' + d + '>Что вспомнить</button>' +
      (Kid.hintOnly() ? '' : '<button class="b t" data-act="tGo" data-v="explain"' + d + '>Объясни</button>') + '</div></div>';
    if (t.busy) h += Kid.busy('Думаю…');
    h += Kid.err(t.error);
    if (t.answer) h += '<div class="card tint"><pre>' + esc(t.answer) + '</pre></div>';
    return h;
  }
  function vMistakes() {
    var list = Kid.mistakes(), h = Kid.head('Тетрадь ошибок', 'Ошибки из проверки. Выученные ошибки отмечены.');
    if (!list.length) return h + '<div class="card">Пока пусто. Проверь решение, и ошибки появятся здесь.</div>';
    list.forEach(function (m) {
      var learned = (m.streak || 0) >= 3;
      h += '<div class="card ' + (learned ? 'okl' : '') + '"><span class="tag ' + (learned ? 'o' : 'e') + '">' + esc(m.subject) + (learned ? ' · ВЫУЧЕНО' : '') + '</span><pre>' + esc(m.wrong) + '</pre>' +
        (m.why ? '<div>Что не так: ' + esc(m.why) + '</div>' : '') + (m.right ? '<div><b>Как правильно: ' + esc(m.right) + '</b></div>' : '') +
        '<button class="b o" data-act="mDel" data-v="' + esc(m.id) + '">Удалить</button></div>';
    });
    return h;
  }
  function pool() { return Kid.mistakes().filter(function (m) { return (m.streak || 0) < 3; }); }
  function norm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[\s.,;:!?«»"'()]+/g, ' ').trim(); }
  function vTrainer() {
    var list = pool(), h = Kid.head('Тренажёр', 'Повтори ошибки, пока не запомнятся');
    if (!list.length) return h + '<div class="card">Нечего повторять. Все ошибки выучены или тетрадь пуста.</div>';
    if (tr.idx >= list.length) tr.idx = 0;
    var m = list[tr.idx];
    h += '<div class="card"><span class="tag e">' + esc(m.subject) + '</span><label>Ты записал так</label><pre>' + esc(m.wrong) + '</pre><label>Как правильно?</label>' + Kid.input('trainer.answer', tr.answer) +
      '<button class="b" data-act="trCheck">Проверить</button> <button class="b o" data-act="trNext">Дальше</button></div>';
    if (tr.shown) h += '<div class="card ' + (tr.verdict === 'ok' ? 'good' : 'bad') + '"><b>' + (tr.verdict === 'ok' ? 'Верно!' : 'Пока не так') + '</b>' + (m.right ? '<div>Правильно: ' + esc(m.right) + '</div>' : '') + (m.why ? '<div class="mut">' + esc(m.why) + '</div>' : '') + '</div>';
    return h + '<p class="mut">В очереди: ' + list.length + '. Ошибка считается выученной после трёх верных ответов подряд.</p>';
  }
  function vProgress() {
    var ms = Kid.mistakes(), learned = ms.filter(function (m) { return (m.streak || 0) >= 3; }).length, h = Kid.head('Мой прогресс', 'Серия занятий и успехи');
    h += '<div class="stat"><div><b>' + S.streak(state.days || []) + '</b>дней подряд</div><div><b>' + (state.tasks || 0) + '</b>заданий проверено</div><div><b>' + learned + '/' + ms.length + '</b>ошибок выучено</div></div>';
    var dots = '';
    for (var i = 6; i >= 0; i--) { var d = new Date(); d.setDate(d.getDate() - i); var iso = Kid.isoDate(d); dots += '<i class="' + ((state.days || []).indexOf(iso) >= 0 ? 'on' : '') + '" title="' + iso + '"></i>'; }
    return h + '<div class="card" style="margin-top:12px">Последние 7 дней<div class="dots">' + dots + '</div></div>';
  }
  function vSettings() {
    var p = Kid.profile(), pf = ui.pf || {}, s = ui.sync, h = Kid.head('Настройки', 'Профиль, общие данные с телефоном и ключ ИИ');
    h += '<div class="card"><b>Профиль</b>' + Kid.input('pf.name', pf.name != null ? pf.name : (p.name || ''), 'Фамилия и имя') + '<div class="row"><div style="flex:1">' + Kid.input('pf.grade', pf.grade != null ? pf.grade : (p.grade || ''), 'Класс') + '</div><div style="flex:1">' + Kid.input('pf.letter', pf.letter != null ? pf.letter : (p.letter || ''), 'Буква') + '</div></div><button class="b t" data-act="pSave">Сохранить профиль</button>' + (ui.setInfo ? '<p class="okt">' + esc(ui.setInfo) + '</p>' : '') + '</div>';
    h += '<div class="card"><b>Общие данные с телефоном (GitHub)</b><p class="mut">Репозиторий должен быть ЧАСТНЫМ, токен выдан только на него. Те же значения вводятся на телефоне: «Ещё» → «Для родителя».</p>' +
      Kid.input('s.repo', settings.repo, 'Репозиторий, например ivan/kid-sync') + Kid.input('s.token', settings.token, 'Токен GitHub', 'password') +
      '<button class="b" data-act="sSync"' + (s.busy ? ' disabled' : '') + '>Сохранить и синхронизировать</button>' + (s.busy ? Kid.busy('Синхронизирую…') : '') +
      (s.msg ? '<p class="' + (s.ok ? 'okt' : 'err') + '">' + esc(s.msg) + '</p>' : '') + (settings.last ? '<p class="mut">Последняя синхронизация: ' + new Date(settings.last).toLocaleString('ru-RU') + '</p>' : '') + '</div>';
    h += '<div class="card"><b>Ключ ИИ</b><p class="mut">Ключ хранится только в этом браузере и никуда не отправляется, кроме сервера ИИ.</p>' + Kid.input('s.aiKey', settings.aiKey, 'Ключ ZVENO AI', 'password') + Kid.input('s.model', settings.model, 'Модель') + Kid.input('s.aiBase', settings.aiBase, 'Адрес API') + '<button class="b t" data-act="aSave">Сохранить</button></div>';
    var cc = Kid.parentCore();
    h += '<div class="card tint"><b>Правила родителя</b><p>' + (cc ? 'Получены с телефона. Закрытых разделов: ' + cc.blocked.length + '. Режим «Только подсказки»: ' + (cc.hintOnly ? 'включён' : 'выключен') + '.' : 'Пока не получены. Они появятся после первой синхронизации с телефоном.') + '</p><p class="mut">Менять правила может только родитель по PIN: «Ещё» → «Для родителя».</p></div>';
    return h;
  }

  Kid.register({ key: 'check', title: 'Проверка', subtitle: 'Разбор ошибок по фото решения', view: vCheck, acts: {
    cSubject: function (v) { c.subject = v; },
    cPhoto: function (v, el) { return Kid.readPhoto(el.files[0]).then(function (d) { c.photo = d; }, function (e) { c.error = e.message; }); },
    cPhotoClear: function () { c.photo = null; },
    cHand: function () { Kid.hand.open(function (text) { c.solution = (c.solution ? c.solution + '\n' : '') + text; Kid.render(); }); },
    cGo: function () {
      c.info = '';
      if (!c.solution.trim() && !c.photo) { c.error = 'Добавь своё решение: текст или фото.'; return; }
      if (c.busy) return;
      c.busy = true; c.error = ''; c.raw = ''; c.parsed = null; Kid.render();
      var text = 'Задание:\n' + (c.task.trim() || '(не указано)') + '\n\nРешение ученика:\n' + (c.solution.trim() || '(решение на фото)');
      return Kid.askAI(C.check(c.subject, Kid.grade()), text, c.photo, 2200, 0.1).then(function (raw) {
        c.raw = raw; c.parsed = C.parseCheck(raw);
        if (c.parsed) Kid.recordTask();
        Kid.syncSoon();
      }, function (e) { c.error = e.message; }).then(function () { c.busy = false; });
    },
    cSave: function () {
      if (!c.parsed) return;
      c.parsed.lines.filter(function (l) { return l.status === 'error'; }).forEach(function (l) { Kid.addMistake(c.subject, l.text, l.fix, l.why); });
      c.info = 'Добавлено в «Тетрадь ошибок»: ' + c.parsed.errorCount + '.'; Kid.syncSoon();
    },
  } });
  Kid.register({ key: 'tutor', title: 'Помощь', subtitle: 'Подсказка и объяснение', view: vTutor, acts: {
    tSubject: function (v) { t.subject = v; },
    tPhoto: function (v, el) { return Kid.readPhoto(el.files[0]).then(function (d) { t.photo = d; }, function (e) { t.error = e.message; }); },
    tPhotoClear: function () { t.photo = null; },
    tHand: function () { Kid.hand.open(function (text) { t.q = (t.q ? t.q + '\n' : '') + text; Kid.render(); }); },
    tGo: function (mode) {
      if (!t.q.trim() && !t.photo) { t.error = 'Напиши вопрос или добавь фото.'; return; }
      if (t.busy) return;
      if (Kid.hintOnly() && mode === 'explain') mode = 'hint';
      t.busy = true; t.error = ''; t.answer = ''; Kid.render();
      return Kid.askAI(C.help(mode, t.subject, Kid.grade()), t.q.trim() || '(вопрос на фото)', t.photo, 1200, 0.3).then(function (a) { t.answer = a; Kid.touchToday(); Kid.syncSoon(); }, function (e) { t.error = e.message; }).then(function () { t.busy = false; });
    },
  } });
  Kid.register({ key: 'mistakes', title: 'Тетрадь ошибок', subtitle: 'Ошибки из проверки', view: vMistakes, acts: {
    mDel: function (id) { S.remove(state.mistakes, id, Date.now()); Kid.syncSoon(); },
  } });
  Kid.register({ key: 'trainer', title: 'Тренажёр', subtitle: 'Повтор ошибок', view: vTrainer, acts: {
    trCheck: function () {
      var m = pool()[tr.idx]; if (!m) return;
      var ok = !!m.right && norm(tr.answer) === norm(m.right);
      tr.shown = true; tr.verdict = ok ? 'ok' : 'no';
      S.put(state.mistakes, Object.assign({}, m, { streak: ok ? (m.streak || 0) + 1 : 0 }), Date.now()); Kid.touchToday(); Kid.syncSoon();
    },
    trNext: function () { tr.idx++; tr.answer = ''; tr.shown = false; tr.verdict = ''; },
  } });
  Kid.register({ key: 'progress', title: 'Мой прогресс', subtitle: 'Серия занятий и успехи', view: vProgress, acts: {} });
  Kid.register({ key: 'settings', title: 'Настройки', subtitle: 'Профиль, GitHub, ключ ИИ', always: true, view: vSettings, acts: {
    pSave: function () {
      var f = ui.pf || {}, p = Kid.profile();
      S.put(state.profile, { id: 'profile', name: f.name != null ? f.name : (p.name || ''), grade: f.grade != null ? f.grade : (p.grade || ''), letter: f.letter != null ? f.letter : (p.letter || '') }, Date.now());
      ui.pf = null; ui.setInfo = 'Сохранено.'; Kid.syncSoon();
    },
    aSave: function () { Kid.persistSettings(); ui.setInfo = 'Сохранено.'; },
    sSync: function () {
      settings.repo = String(settings.repo).trim(); settings.token = String(settings.token).trim(); Kid.persistSettings();
      if (!Kid.syncConfigured()) { ui.sync.ok = false; ui.sync.msg = 'Адрес должен быть вида имя/репозиторий, и нужен токен.'; return; }
      return Kid.syncNow(false);
    },
  } });
})();

</script>
<script>
// «Для родителя»: вход по PIN, разделы, режимы, время, отчёт. Правила подписываются PIN и доезжают до телефона.
(function () {
  'use strict';
  var Kid = window.Kid, P = window.KidParent, esc = Kid.esc, state = Kid.state;
  var m = Kid.mod('parentUi', { pin: '', error: '', info: '', from: '', to: '', limit: '', init: false, nl: '', np: '' });
  // Те же ключи и названия, что в Sections.kt на телефоне.
  var ALL = [['hw', 'ДЗ'], ['tutor', 'Помощь'], ['check', 'Проверка работы по фото'], ['visual', 'Наглядно'], ['friend', 'Спроси друга'], ['ar', 'AR-линза'], ['assigned', 'Что задано'], ['reading', 'Чтение'],
    ['history', 'Историческая справка'], ['essay', 'Реферат'], ['memos', 'Заметки'], ['reminders', 'Напоминания'], ['cheats', 'Шпаргалки'], ['mistakes', 'Тетрадь ошибок'], ['trainer', 'Тренажёр'],
    ['exam', 'К контрольной'], ['words', 'Слова и диктант'], ['notes', 'Конспект параграфа'], ['progress', 'Мой прогресс'], ['timer', 'Таймер учёбы']];
  var FOCUS = ['check', 'mistakes', 'trainer', 'progress'];   // режим «Только работа над ошибками»
  function core() { return Kid.parentCore() || Object.assign({}, P.DEFAULT); }
  function sw(label, key, on, act) { return '<label class="swrow"><span>' + esc(label) + '</span><input type="checkbox" data-act="' + act + '" data-v="' + key + '"' + (on ? ' checked' : '') + '></label>'; }

  function view() {
    var h = Kid.head('Для родителя', 'Разделы, режимы и время на компьютере');
    if (!Kid.parentLoggedIn()) {
      h += '<div class="card"><b>Вход</b><p class="mut">' + (Kid.parentHasPin() ? 'Введи PIN родителя, тот же, что на телефоне.' : 'Правила родителя ещё не пришли с телефона. На телефоне задай PIN («Ещё» → «Для родителя»), нажми «Сохранить и синхронизировать», затем обнови эту страницу.') + '</p>' +
        '<label>PIN</label><input id="ppin" type="password" inputmode="numeric" autocomplete="off" data-bind="parentUi.pin" value="' + esc(m.pin) + '"><button class="b" data-act="pLogin"' + (Kid.parentHasPin() ? '' : ' disabled') + '>Войти</button>' + Kid.err(m.error) + '</div>';
      return h;
    }
    var c = core(), blocked = {};
    c.blocked.forEach(function (k) { blocked[k] = 1; });
    if (!m.init) { m.from = P.fmt(c.fromMin); m.to = P.fmt(c.toMin); m.limit = c.limitMin ? String(c.limitMin) : ''; m.init = true; }
    h += '<div class="card tint row" style="justify-content:space-between;align-items:center"><span>Вы вошли как родитель. Через 15 минут без действий вход закроется.</span><button class="b o" data-act="pLogout">Выйти</button></div>';
    h += '<div class="card"><b>Разделы</b><p class="mut">Выключенный раздел исчезает у ребёнка на компьютере. Телефон получит те же правила после синхронизации.</p>' +
      '<div class="row"><button class="b t" data-act="pFocus">Только работа над ошибками</button><button class="b o" data-act="pAll">Включить все разделы</button></div>' +
      ALL.map(function (s) { return sw(s[1], s[0], !blocked[s[0]], 'pSec'); }).join('') + '<p class="mut">«Для родителя», «Как пользоваться» и «Настройки» выключить нельзя.</p></div>';
    h += '<div class="card"><b>Режим</b>' + sw('Только подсказки (без готовых решений)', 'hint', c.hintOnly, 'pFlag') + '</div>';
    h += '<div class="card"><b>Время</b>' + sw('Учебные часы (вне них приложение закрыто)', 'sched', c.scheduleOn, 'pFlag') +
      '<div class="row"><div style="flex:1">' + Kid.input('parentUi.from', m.from, 'С (ЧЧ:ММ)') + '</div><div style="flex:1">' + Kid.input('parentUi.to', m.to, 'До (ЧЧ:ММ)') + '</div><div style="flex:1">' + Kid.input('parentUi.limit', m.limit, 'Лимит в день, минут (пусто = без лимита)') + '</div></div>' +
      '<button class="b t" data-act="pTime">Сохранить время</button><p class="mut">Сегодня на этом компьютере: ' + Math.round(Kid.usedSec() / 60) + ' мин' + (c.limitMin ? ', осталось ' + P.minutesLeft(c, Kid.usedSec()) + ' мин' : '') + '. Когда время выйдет, ребёнок увидит экран отдыха, а родитель сможет разрешить ещё 30 минут по PIN.</p></div>';
    h += report();
    h += accountsCard();
    if (m.info) h += '<p class="okt">' + esc(m.info) + '</p>';
    h += Kid.err(m.error);
    return h;
  }
  function accountsCard() {
    var rows = Kid.gate.list().map(function (r) {
      return '<div class="row" style="justify-content:space-between;align-items:center"><span><b>' + esc(r.login) + '</b> · ' + (r.role === 'parent' ? 'родитель' : 'ребёнок') + '</span><button class="b o" data-act="pAccDel" data-v="' + esc(r.login) + '">Удалить</button></div>';
    }).join('');
    return '<div class="card"><b>Вход на компьютере</b><p class="mut">Логины и пароли для этого сайта (общие для всех компьютеров семьи). Вход ребёнка не показывает раздел «Для родителя». Пароль нигде не хранится, только его защитный отпечаток.</p>' + rows +
      '<div class="row"><div style="flex:1">' + Kid.input('parentUi.nl', m.nl, 'Новый логин') + '</div><div style="flex:1">' + Kid.input('parentUi.np', m.np, 'Пароль (от 6 символов)', 'password') + '</div></div>' +
      '<div class="row"><button class="b t" data-act="pAccAdd" data-v="child">Добавить вход ребёнка</button><button class="b o" data-act="pAccAdd" data-v="parent">Добавить вход родителя</button></div></div>';
  }
  function report() {
    var rows = '', u = state.usage || {};
    for (var i = 0; i < 7; i++) {
      var d = new Date(); d.setDate(d.getDate() - i); var iso = Kid.isoDate(d), pc = (u.pc || {})[iso] || 0, ph = (u.phone || {})[iso] || 0;
      rows += '<tr><td>' + iso.slice(8) + '.' + iso.slice(5, 7) + '</td><td>' + ph + '</td><td>' + pc + '</td></tr>';
    }
    return '<div class="card"><b>Отчёт за неделю, минут</b><table class="tbl"><tr><th>День</th><th>Телефон</th><th>Компьютер</th></tr>' + rows + '</table><p class="mut">Данные телефона появляются после синхронизации.</p></div>';
  }
  function save(next, info) {
    m.error = ''; m.info = '';
    return Kid.setParentCore(next).then(function () { m.info = info || 'Сохранено. Телефон применит правила при следующей синхронизации.'; }, function (e) { m.error = e.message; });
  }
  function keysFrom(c) { return c.blocked.filter(function (k) { return !ALL.some(function (s) { return s[0] === k; }); }); }  // чужие ключи сохраняем как есть

  Kid.register({ key: 'parent', title: 'Для родителя', subtitle: 'Разделы, режимы, время', always: true, view: view, acts: {
    pLogin: function () { m.error = ''; return Kid.parentLogin(m.pin).then(function () { m.pin = ''; m.init = false; }, function (e) { m.error = e.message; }); },
    pAccAdd: function (role) { m.error = ''; m.info = ''; return Kid.gate.add(m.nl, role, m.np).then(function () { m.nl = ''; m.np = ''; m.info = 'Вход добавлен.'; }, function (e) { m.error = e.message; }); },
    pAccDel: function (login) { m.error = ''; m.info = ''; try { Kid.gate.remove(login); m.info = 'Вход удалён.'; } catch (e) { m.error = e.message; } },
    pLogout: function () { Kid.parentLogout(); m.init = false; },
    pSec: function (key, el) {
      var c = core(), b = c.blocked.filter(function (k) { return k !== key; });
      if (!el.checked) b.push(key);
      return save(Object.assign({}, c, { blocked: b }));
    },
    pFocus: function () { var c = core(); return save(Object.assign({}, c, { blocked: ALL.map(function (s) { return s[0]; }).filter(function (k) { return FOCUS.indexOf(k) < 0; }).concat(keysFrom(c)) })); },
    pAll: function () { var c = core(); return save(Object.assign({}, c, { blocked: keysFrom(c) })); },
    pFlag: function (key, el) {
      var c = core();
      return save(key === 'hint' ? Object.assign({}, c, { hintOnly: el.checked }) : Object.assign({}, c, { scheduleOn: el.checked }));
    },
    pTime: function () {
      var f = P.parseTime(m.from), t = P.parseTime(m.to), l = m.limit.trim() === '' ? 0 : parseInt(m.limit, 10);
      if (f == null || t == null) { m.error = 'Время нужно писать так: 07:00.'; return; }
      if (!(l >= 0 && l <= 600)) { m.error = 'Лимит: число минут от 0 до 600.'; return; }
      return save(Object.assign({}, core(), { fromMin: f, toMin: t, limitMin: l }));
    },
  } });
})();
