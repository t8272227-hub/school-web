<script>
// Чистая логика разделов «ДЗ», «Реферат», «К контрольной», «Конспект», «Слова и диктант» (без DOM).
// Порт Prompts.kt, AiJson.kt и части Screens1/3/4.kt. Проверяется в Node. Формат как в sync.js: module.exports или window.Kid_study
(function (root) {
  'use strict';
  var C = root.KidCheck || (typeof require !== 'undefined' ? require('../check.js') : null);
  var api = {};

  // ---------- общее ----------
  api.LEVELS = [
    { name: 'FRIEND', label: 'Как другу', rule: 'Объясни как другу: очень просто, коротко, с примером из жизни.' },
    { name: 'BOOK', label: 'Как в учебнике', rule: 'Объясни как в учебнике: точно, с правилами и терминами, но понятно.' },
    { name: 'DETAILED', label: 'Подробно', rule: 'Объясни подробно: по шагам, с примерами и объяснением, почему так.' },
  ];
  api.levelByLabel = function (label) { return api.LEVELS.filter(function (l) { return l.label === label; })[0] || api.LEVELS[1]; };

  // ---------- промпты (Prompts.kt) ----------
  api.promptFormat = function (subject, grade) {
    return C.base(grade) + ' Оформи решение задания так, как его записывают в тетради по предмету «' + subject + '». ' +
      'Для математики и физики: номер задания, Дано, Найти, Решение (каждое действие с новой строки), Проверка, Ответ. ' +
      'Для русского языка: само упражнение с вставленными буквами и знаками и короткими пометками правил. ' +
      'Для остальных предметов: Дано, Решение, Ответ. Выводи только запись для тетради, без вступлений.';
  };
  api.promptSteps = function (subject, grade) {
    return C.base(grade) + ' Реши задание по предмету «' + subject + '» по шагам. Каждый шаг отдели от следующего строкой из трёх дефисов (---). ' +
      'В шаге одно действие и короткое пояснение, почему так. В последнем шаге напиши «Ответ: …». Проверь ответ подстановкой.';
  };
  api.promptExplain = function (subject, grade, levelLabel) {
    return C.base(grade) + ' Объясни тему или задание по предмету «' + subject + '». ' + api.levelByLabel(levelLabel).rule;
  };
  api.promptEssayPlan = function (subject, grade) {
    return C.base(grade) + ' Составь план реферата по предмету «' + subject + '»: 5–7 коротких пунктов, последний пункт «Вывод». Каждый пункт с новой строки, с номером.';
  };
  api.essayChars = function (pages) { return pages === 1 ? 1800 : pages === 2 ? 3600 : 6300; };
  api.promptEssayText = function (subject, grade, pages) {
    return C.base(grade) + ' Напиши текст реферата по предмету «' + subject + '» по плану ученика, объёмом около ' + api.essayChars(pages) + ' знаков. Пиши связно, по пунктам плана, ' +
      'заголовок каждого пункта отдельной строкой с номером. Не придумывай список литературы и ссылки, не приводи точные числа и даты, в которых не уверен. ' +
      'Если к пункту нужна схема или рисунок, в конце пункта напиши строку [СХЕМА: короткое название], не больше двух на весь текст.';
  };
  api.promptNotes = function (subject, grade) {
    return C.base(grade) + ' Сделай конспект параграфа по предмету «' + subject + '» по тексту или фото. Верни ТОЛЬКО JSON: ' +
      '{"short":"краткий пересказ 2–4 предложения","plan":["пункт"],"terms":[{"term":"","meaning":""}],' +
      '"questions":["вопрос для самопроверки"]}. Даты и имена указывай только если они есть в тексте.';
  };
  api.promptExamPlan = function (subject, grade) {
    return C.base(grade) + ' Составь план повторения к контрольной по предмету «' + subject + '». Верни ТОЛЬКО JSON: ' +
      '{"days":[{"day":"Сегодня","task":"что сделать","minutes":15}],"cheat":"короткая шпаргалка по теме"}. ' +
      'Дней столько, сколько указал ученик, на день не больше 30 минут.';
  };
  api.promptWords = function (grade) {
    return C.base(grade) + ' Подбери слова по теме для запоминания. Верни ТОЛЬКО JSON-массив: [{"front":"слово на языке изучения","back":"перевод или значение"}]. Ровно 10 слов.';
  };
  api.promptDictation = function (grade) {
    return C.base(grade) + ' Подбери слова для диктанта. Верни ТОЛЬКО JSON-массив из 10 слов: ["слово"]. Слова должны подходить по возрасту.';
  };
  api.promptPhotoOcr = function () {
    return 'Перепиши текст задания с фото точно, ничего не решай. Условие, номера и данные сохрани, формулы пиши в одну строку. ' +
      'Если часть неразборчива, поставь [?]. Выводи только текст задания.';
  };

  // ---------- разбор JSON (AiJson.kt) ----------
  function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
  function str(v) {
    if (typeof v === 'string') return v;
    if (typeof v === 'number') return String(v);
    if (typeof v === 'boolean') return String(v);
    return null;
  }
  function parseOrNull(t) { try { return JSON.parse(t); } catch (e) { return null; } }
  function obj(raw) {
    var j = C.extractJson(raw || '');
    var v = j ? parseOrNull(j) : null;
    return isObj(v) ? v : null;
  }
  function array(raw) {
    raw = raw || '';
    var s = raw.indexOf('['), e = raw.lastIndexOf(']');
    if (s < 0 || e <= s) return null;
    var v = parseOrNull(raw.slice(s, e + 1));
    return Array.isArray(v) ? v : null;
  }
  function strings(v) {
    if (!Array.isArray(v)) return [];
    var out = [];
    v.forEach(function (x) { var s = str(x); if (s !== null && s.trim()) out.push(s.trim()); });
    return out;
  }
  function trimmed(v) { var s = str(v); return s === null ? '' : s.trim(); }

  api.parseNotes = function (raw) {
    var o = obj(raw); if (!o) return null;
    var short = trimmed(o.short); if (!short) return null;
    var terms = [];
    (Array.isArray(o.terms) ? o.terms : []).forEach(function (it) {
      if (!isObj(it)) return;
      var term = trimmed(it.term); if (!term) return;
      terms.push({ term: term, meaning: trimmed(it.meaning) });
    });
    return { short: short, plan: strings(o.plan), terms: terms, questions: strings(o.questions) };
  };

  api.parseExamPlan = function (raw) {
    var o = obj(raw); if (!o) return null;
    var days = [];
    (Array.isArray(o.days) ? o.days : []).forEach(function (d) {
      if (!isObj(d)) return;
      var task = trimmed(d.task); if (!task) return;
      var min;
      if (typeof d.minutes === 'number') min = Math.trunc(d.minutes);
      else {
        var s = str(d.minutes), digits = s === null ? '' : s.replace(/\D/g, '');
        min = digits && isFinite(parseInt(digits, 10)) ? parseInt(digits, 10) : 15;
      }
      days.push({ day: trimmed(d.day), task: task, minutes: min });
    });
    if (!days.length) return null;
    return { days: days, cheat: trimmed(o.cheat) };
  };

  api.parseWords = function (raw) {
    var arr = array(raw); if (!arr) return null;
    var out = [];
    arr.forEach(function (it) {
      if (!isObj(it)) return;
      var f = trimmed(it.front), b = trimmed(it.back);
      if (f && b) out.push({ front: f, back: b });
    });
    return out.length ? out : null;
  };

  api.parseDictation = function (raw) {
    var arr = array(raw); if (!arr) return null;
    var out = strings(arr);
    return out.length ? out : null;
  };

  // «apple - яблоко» построчно → пары слов
  api.parseWordLines = function (text) {
    var out = [];
    String(text || '').split(/\r\n|\r|\n/).forEach(function (line) {
      var m = /\s*[-–—=:]\s*/.exec(line);
      if (!m) return;
      var a = line.slice(0, m.index), b = line.slice(m.index + m[0].length);
      if (a.trim() && b.trim()) out.push({ front: a.trim(), back: b.trim() });
    });
    return out;
  };

  // Шаги решения, разделённые строкой --- (или ***)
  api.splitSteps = function (text) {
    return String(text || '').split(/^[ \t]*(?:-{3,}|\*{3,})[ \t]*$/m).map(function (s) { return s.trim(); }).filter(Boolean);
  };

  // ---------- колода слов (Store.cards) ----------
  // карточка: { f, b, k }. Новые слова добавляются в начало, повторы по слову заменяются новыми.
  api.mergeDeck = function (deck, words) {
    var fresh = words.map(function (w) { return { f: w.front, b: w.back, k: false }; });
    return fresh.concat(deck.filter(function (d) { return !words.some(function (w) { return w.front === d.f; }); }));
  };
  api.addOwn = function (deck, words) { return words.map(function (w) { return { f: w.front, b: w.back, k: false }; }).concat(deck); };
  api.queue = function (deck) { return deck.filter(function (c) { return !c.k; }); };
  function firstOpen(deck) { var i = -1; deck.forEach(function (c, k) { if (i < 0 && !c.k) i = k; }); return i; }
  // «Знаю»: первая невыученная карточка помечается
  api.markKnown = function (deck) {
    var i = firstOpen(deck);
    return deck.map(function (c, k) { return k === i ? { f: c.f, b: c.b, k: true } : c; });
  };
  // «Ещё раз»: первая невыученная карточка уходит в конец колоды
  api.repeatLater = function (deck) {
    var i = firstOpen(deck);
    if (i < 0) return deck.slice();
    return deck.filter(function (c, k) { return k !== i; }).concat([deck[i]]);
  };
  api.resetDeck = function (deck) { return deck.map(function (c) { return { f: c.f, b: c.b, k: false }; }); };

  // ---------- мои ДЗ (Store.homework) ----------
  api.addHomework = function (list, subject, task, result, id, date) {
    return [{ id: id, subject: subject, task: task, result: result, date: date }].concat(list).slice(0, 100);
  };
  api.deleteHomework = function (list, id) { return list.filter(function (h) { return h.id !== id; }); };

  // ---------- реферат ----------
  api.cleanEssay = function (text) { return String(text || '').replace(/\[СХЕМА:[^\]]*\]/g, '').replace(/\n{3,}/g, '\n\n').trim(); };
  api.schemeMarkers = function (text) {
    var out = [], re = /\[СХЕМА:([^\]]*)\]/g, m;
    while ((m = re.exec(String(text || '')))) { var n = m[1].trim(); if (n) out.push(n); }
    return out;
  };
  api.SCHEMES = ['Без схемы', 'Круговорот воды', 'Растительная клетка', 'Атом углерода'];
  // Блоки документа реферата: заголовок «1. Введение» (короче 90 знаков) идёт как подзаголовок
  api.essayBlocks = function (topicOrSubject, text) {
    var out = [{ t: 'h', text: 'Тема: ' + topicOrSubject }];
    api.cleanEssay(text).split('\n').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (par) {
      out.push({ t: /^\d+[.)]\s/.test(par) && par.length < 90 ? 'h' : 'p', text: par });
    });
    return out;
  };

  // ---------- документы для экспорта: блоки { t: 'h' | 'p' | 'm', text } ----------
  function lines(text) { return String(text || '').split(/\r\n|\r|\n/).filter(function (l) { return l.trim(); }).map(function (l) { return { t: 'p', text: l.replace(/\s+$/, '') }; }); }
  api.lineBlocks = lines;
  api.hwBlocks = function (subject, task, result) {
    return [{ t: 'h', text: 'Предмет: ' + subject }, { t: 'h', text: 'Задание' }].concat(lines(task), [{ t: 'h', text: 'Решение' }], lines(result));
  };
  api.examBlocks = function (subject, topic, plan) {
    var out = [{ t: 'h', text: subject + '. Тема: ' + topic }];
    plan.days.forEach(function (d, i) { out.push({ t: 'p', text: (d.day || 'День ' + (i + 1)) + ' (' + d.minutes + ' мин): ' + d.task }); });
    if (plan.cheat) { out.push({ t: 'h', text: 'Шпаргалка' }); out = out.concat(lines(plan.cheat).map(function (b) { return { t: 'm', text: b.text }; })); }
    return out;
  };
  api.notesBlocks = function (r) {
    var out = [{ t: 'h', text: 'Кратко' }, { t: 'p', text: r.short }];
    if (r.plan.length) { out.push({ t: 'h', text: 'План' }); r.plan.forEach(function (p, i) { out.push({ t: 'p', text: (i + 1) + '. ' + p }); }); }
    if (r.terms.length) { out.push({ t: 'h', text: 'Термины' }); r.terms.forEach(function (t) { out.push({ t: 'p', text: t.term + ' — ' + t.meaning }); }); }
    if (r.questions.length) { out.push({ t: 'h', text: 'Вопросы' }); r.questions.forEach(function (q, i) { out.push({ t: 'p', text: (i + 1) + '. ' + q }); }); }
    return out;
  };
  api.wordsBlocks = function (deck) { return deck.map(function (c) { return { t: 'p', text: c.f + ' — ' + c.b }; }); };
  api.dictationBlocks = function (words) { return words.map(function (w, i) { return { t: 'p', text: (i + 1) + '. ' + w }; }); };
  api.blocksToHtml = function (blocks, esc) {
    return blocks.map(function (b) {
      return b.t === 'h' ? '<h2>' + esc(b.text) + '</h2>' : b.t === 'm' ? '<p style="font-family:Courier New,monospace">' + esc(b.text) + '</p>' : '<p>' + esc(b.text) + '</p>';
    }).join('');
  };

  // ---------- схемы для реферата (Renderers.waterCycle / plantCell / atom) ----------
  function tx(txt, x, y, size, fill, bold, anchor) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" fill="' + fill + '"' + (bold ? ' font-weight="700"' : '') + (anchor ? ' text-anchor="' + anchor + '"' : '') + ' font-family="sans-serif">' + txt + '</text>';
  }
  function circ(x, y, r, fill, stroke, sw) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + (fill || 'none') + '"' + (stroke ? ' stroke="' + stroke + '" stroke-width="' + sw + '"' : '') + '/>';
  }
  function line(x1, y1, x2, y2, c, w) { return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + c + '" stroke-width="' + w + '"/>'; }
  function arrow(x1, y1, x2, y2, c, w) {
    var a = Math.atan2(y2 - y1, x2 - x1), h = 30, s = 0.45;
    var p = [[x2, y2], [x2 - h * Math.cos(a - s), y2 - h * Math.sin(a - s)], [x2 - h * Math.cos(a + s), y2 - h * Math.sin(a + s)]];
    return line(x1, y1, x2, y2, c, w) + '<polygon points="' + p.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '" fill="' + c + '"/>';
  }
  function oval(cx, cy, rx, ry, fill, stroke, sw) { return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>'; }
  function rrect(x1, y1, x2, y2, fill, stroke, sw, r) {
    return '<rect x="' + x1 + '" y="' + y1 + '" width="' + (x2 - x1) + '" height="' + (y2 - y1) + '" rx="' + r + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
  }
  function svgWrap(w, h, bg, body) {
    return '<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '"><rect width="' + w + '" height="' + h + '" fill="' + bg + '"/>' + body + '</svg>';
  }
  var AXIS = '#282828';

  function btn(act, label, kind, v, extra) { return '<button class="b' + (kind ? ' ' + kind : '') + '" data-act="' + act + '"' + (v != null ? ' data-v="' + esc(v) + '"' : '') + (extra || '') + '>' + esc(label) + '</button>'; }
  function infoLine(t) { return t ? '<p class="okt">' + esc(t) + '</p>' : ''; }

  // Запуск ИИ с учётом занятости и ошибок. После успеха: учёт дня и синхронизация (как Ai.ask на телефоне).
  function run(m, system, text, o, onOk) {
    if (m.busy) return undefined;
    o = o || {};
    m.busy = true; m.error = ''; Kid.render();
    return Kid.askAI(system, text, o.photo, o.max, o.temp).then(function (raw) {
      onOk(raw); Kid.touchToday(); Kid.syncSoon();
    }).catch(function (e) { m.error = (e && e.message) || 'Ошибка.'; }).then(function () { m.busy = false; });
  }

  // Ввод задания: текст, фото (сразу переписывается в текст через ИИ), галерея, голос. Стилуса в браузере нет.
  function taskInput(key, m, label, pre) {
    var h = ta(key + '.' + (pre.field), m[pre.field], label);
    h += '<div class="row"><div style="flex:1"><label>Фото</label><input type="file" accept="image/*" capture="environment" data-act="' + pre.photo + '"></div>' +
      '<div style="flex:1"><label>Из галереи</label><input type="file" accept="image/*" data-act="' + pre.photo + '"></div></div>';
    if (Kid.canListen()) h += btn(pre.voice, m.listening ? 'Слушаю…' : 'Голос', 't');
    if (m.thumb) h += '<img class="st-thumb" src="' + m.thumb + '" alt="Фото задания">';
    if (m.ocr) h += Kid.busy('Читаю фото…');
    return h;
  }
  function photoAct(m, field) {
    return function (v, el) {
      var f = el.files && el.files[0]; if (!f) return undefined;
      m.error = '';
      return Kid.readPhoto(f).then(function (data) {
        m.thumb = data; m.ocr = true; Kid.render();
        return Kid.askAI(L.promptPhotoOcr(), 'Перепиши задание с фото.', data).then(function (t) {
          m[field] = (m[field] || '').trim() ? m[field].replace(/\s+$/, '') + '\n' + t : t;
          Kid.touchToday(); Kid.syncSoon();
        });
      }).catch(function (e) { m.error = (e && e.message) || 'Не получилось открыть картинку.'; }).then(function () { m.ocr = false; });
    };
  }
  function voiceAct(m, field) {
    return function () {
      if (m.listening) return;
      m.listening = true; m.error = '';
      Kid.listen(function (said) {
        if (said) m[field] = (m[field] || '').trim() ? m[field].replace(/\s+$/, '') + ' ' + said : said;
        Kid.render();
      }, function (msg) { m.listening = false; if (msg) m.error = msg; Kid.render(); });
    };
  }

  // Экспорт: Word (.doc) и печать/PDF. Содержимое собирается в момент нажатия функцией exporters[key]().
  var exporters = {}, expMsg = {};
  function exportBar(key) {
    return '<div class="row">' + btn('stExp', 'Word', 't', key + '|word') + btn('stExp', 'PDF / печать', 't', key + '|print') + '</div>' + (expMsg[key] ? '<p class="mut">' + esc(expMsg[key]) + '</p>' : '');
  }
  function svgToPng(svg) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onerror = function () { reject(new Error('svg')); };
      img.onload = function () {
        try {
          var cv = document.createElement('canvas'); cv.width = 1000; cv.height = Math.round(1000 * (img.height || 760) / (img.width || 1000));
          var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/png'));
        } catch (e) { reject(e); }
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
  }
  var expAct = function (v) {
    var p = String(v).split('|'), key = p[0], kind = p[1], ex = exporters[key] ? exporters[key]() : null;
    if (!ex) return undefined;
    var html = L.blocksToHtml(ex.blocks, esc);
    if (kind === 'print') {
      var svg = ex.svg ? '<div style="margin-top:12px">' + ex.svg.replace('class="fig"', 'class="fig" style="max-width:100%;height:auto"') + '</div>' : '';
      expMsg[key] = Kid.printHtml(ex.title, html + svg) ? 'Открыто окно печати: выбери принтер или «Сохранить как PDF».' : 'Браузер заблокировал окно печати. Разреши всплывающие окна для этой страницы.';
      return undefined;
    }
    function done() { expMsg[key] = 'Файл Word сохранён в папку загрузок.'; }
    if (ex.svg) return svgToPng(ex.svg).then(function (png) { Kid.saveWord(ex.title, html + '<p><img src="' + png + '" width="600"></p>'); done(); }, function () { Kid.saveWord(ex.title, html); done(); });
    Kid.saveWord(ex.title, html); done(); return undefined;
  };

  // ====================================================================== ДЗ
  var hw = Kid.mod('hw', { subject: 'Математика', task: '', result: '', kind: '', level: 'Как в учебнике', busy: false, error: '', info: '', showSaved: false, thumb: null, ocr: false, listening: false });
  function saved() { return Kid.store('homework', []); }

  function vHw() {
    var h = Kid.head('ДЗ', 'Оформим как в тетради'), list = saved();
    h += '<div class="card"><label>Предмет</label>' + Kid.chips(SUBJ, hw.subject, 'stHwSubject') + taskInput('hw', hw, 'Задание', { field: 'task', photo: 'stHwPhoto', voice: 'stHwVoice' }) +
      '<div class="row">' + btn('stHwGo', 'Как в тетради', '', 'format', dis(hw)) + btn('stHwGo', 'По шагам', 't', 'steps', dis(hw)) + '</div>' +
      '<label>Пояснить</label>' + Kid.chips(L.LEVELS.map(function (l) { return l.label; }), hw.level, 'stHwLevel') +
      btn('stHwGo', 'Пояснить', 'o', 'explain', dis(hw)) + '</div>';
    if (hw.busy) h += Kid.busy('Думаю…');
    h += Kid.err(hw.error);
    if (hw.result.trim()) {
      if (hw.kind === 'steps') {
        L.splitSteps(hw.result).forEach(function (s, i) { h += '<div class="card"><label>Шаг ' + (i + 1) + '</label><pre>' + esc(s) + '</pre></div>'; });
      } else h += '<div class="card"><pre>' + esc(hw.result) + '</pre></div>';
      h += '<div class="row">' + btn('stHwSave', 'В мои ДЗ', 't') + btn('stHwNew', 'Новое', 'o') + '</div>' + infoLine(hw.info);
      h += exportBar('hw');
    }
    h += btn('stHwToggle', hw.showSaved ? 'Скрыть «Мои ДЗ»' : 'Мои ДЗ (' + list.length + ')', 'o');
    if (hw.showSaved) {
      if (!list.length) h += '<p class="mut">Пока ничего не сохранено.</p>';
      list.forEach(function (x) {
        h += '<div class="card"><b>' + esc(x.subject) + ', ' + esc(x.date) + '</b><div>' + esc(String(x.task).slice(0, 160)) + '</div>' +
          '<div class="row">' + btn('stHwOpen', 'Открыть', 't', x.id) + btn('stHwDel', 'Удалить', 'o', x.id) + '</div></div>';
      });
    }
    return h;
  }
  exporters.hw = function () { return { title: 'ДЗ: ' + hw.subject, blocks: L.hwBlocks(hw.subject, hw.task, hw.result) }; };

  Kid.register({ key: 'hw', title: 'ДЗ', subtitle: 'Оформим как в тетради', view: vHw, acts: {
    stHwSubject: function (v) { hw.subject = v; },
    stHwLevel: function (v) { hw.level = v; },
    stHwPhoto: photoAct(hw, 'task'),
    stHwVoice: voiceAct(hw, 'task'),
    stHwGo: function (k) {
      hw.info = '';
      if (!hw.task.trim()) { hw.error = 'Сначала введи задание.'; return undefined; }
      var hint = Kid.hintOnly(), grade = Kid.grade(), system;
      if (hint && k !== 'explain') system = C.help('hint', hw.subject, grade);
      else if (k === 'format') system = L.promptFormat(hw.subject, grade);
      else if (k === 'steps') system = L.promptSteps(hw.subject, grade);
      else system = L.promptExplain(hw.subject, grade, hw.level);
      if (hint && k !== 'explain') hw.info = 'Включён режим подсказок: готовое решение не показывается.';
      var task = hw.task;
      return run(hw, system, task, { max: 1800, temp: 0.3 }, function (raw) { hw.kind = hint ? 'explain' : k; hw.result = raw; });
    },
    stHwSave: function () {
      Kid.saveStore('homework', L.addHomework(saved(), hw.subject, hw.task, hw.result, Kid.newId(), Kid.today()));
      hw.info = 'Сохранено в «Мои ДЗ».';
    },
    stHwNew: function () { hw.task = ''; hw.result = ''; hw.kind = ''; hw.thumb = null; hw.info = ''; },
    stHwToggle: function () { hw.showSaved = !hw.showSaved; },
    stHwOpen: function (id) {
      var x = saved().filter(function (s) { return s.id === id; })[0]; if (!x) return;
      hw.subject = x.subject; hw.task = x.task; hw.result = x.result; hw.kind = 'format';
    },
    stHwDel: function (id) { Kid.saveStore('homework', L.deleteHomework(saved(), id)); },
    stExp: expAct,
  } });

  // ====================================================================== Реферат
  var es = Kid.mod('essay', { subject: 'История', topic: '', pages: '2 стр', plan: '', text: '', scheme: 'Без схемы', busy: false, error: '' });

  function vEssay() {
    var h = Kid.head('Реферат', 'Составлю план и текст');
    h += '<div class="card"><label>Предмет</label>' + Kid.chips(SUBJ, es.subject, 'stEsSubject') + Kid.input('essay.topic', es.topic, 'Тема реферата') +
      '<label>Объём</label>' + Kid.chips(['1 стр', '2 стр', '3 стр'], es.pages, 'stEsPages') + btn('stEsPlan', 'Составить план', 't', null, dis(es));
    if (es.plan.trim() || es.text.trim()) h += ta('essay.plan', es.plan, 'План (можно править)');
    if (es.plan.trim()) h += btn('stEsText', 'Написать реферат', '', null, dis(es));
    h += '</div>';
    if (es.busy) h += Kid.busy('Пишу…');
    h += Kid.err(es.error);
    if (es.text.trim()) {
      h += '<div class="card">' + ta('essay.text', es.text, 'Текст реферата (можно править)', 'st-big');
      var marks = L.schemeMarkers(es.text);
      if (marks.length) h += '<p class="mut">ИИ предложил схемы: ' + marks.map(esc).join('; ') + '. Выбери подходящую ниже, если она есть в списке.</p>';
      h += '<label>Схема в конце реферата</label>' + Kid.chips(L.SCHEMES, es.scheme, 'stEsScheme');
      var svg = L.schemeSvg(es.scheme);
      if (svg) h += '<div class="st-fig">' + svg + '</div>';
      h += exportBar('essay') + '</div>';
    }
    return h;
  }
  exporters.essay = function () {
    return { title: 'Реферат: ' + (es.topic.trim() || es.subject), blocks: L.essayBlocks(es.topic.trim() || es.subject, es.text), svg: L.schemeSvg(es.scheme) };
  };
  Kid.register({ key: 'essay', title: 'Реферат', subtitle: 'План, текст и схемы', view: vEssay, acts: {
    stEsSubject: function (v) { es.subject = v; },
    stEsPages: function (v) { es.pages = v; },
    stEsScheme: function (v) { es.scheme = v; },
    stEsPlan: function () {
      if (!es.topic.trim()) { es.error = 'Напиши тему.'; return undefined; }
      return run(es, L.promptEssayPlan(es.subject, Kid.grade()), 'Тема: ' + es.topic, {}, function (raw) { es.plan = raw; });
    },
    stEsText: function () {
      var pages = parseInt(es.pages.slice(0, 1), 10) || 2;
      return run(es, L.promptEssayText(es.subject, Kid.grade(), pages), 'Тема: ' + es.topic + '\nПлан:\n' + es.plan, { max: 4500, temp: 0.5 }, function (raw) { es.text = raw; });
    },
  } });

  // ====================================================================== К контрольной
  var ex = Kid.mod('exam', { subject: 'Математика', topic: '', days: '5 дней', plan: null, busy: false, error: '' });

  function vExam() {
    var h = Kid.head('К контрольной', 'План повторения по дням');
    h += '<div class="card"><label>Предмет</label>' + Kid.chips(SUBJ, ex.subject, 'stExSubject') + Kid.input('exam.topic', ex.topic, 'Тема контрольной') +
      '<label>Сколько дней осталось</label>' + Kid.chips(['2 дня', '3 дня', '5 дней', '7 дней'], ex.days, 'stExDays') + btn('stExGo', 'Составить план', '', null, dis(ex)) + '</div>';
    if (ex.busy) h += Kid.busy('Составляю план…');
    h += Kid.err(ex.error);
    var p = ex.plan;
    if (p) {
      p.days.forEach(function (d, i) {
        h += '<div class="card"><b style="color:var(--v)">' + esc(d.day || 'День ' + (i + 1)) + ' · ' + esc(d.minutes) + ' мин</b><pre>' + esc(d.task) + '</pre></div>';
      });
      if (p.cheat) h += '<div class="card tint"><label>Шпаргалка</label><pre class="st-mono">' + esc(p.cheat) + '</pre></div>';
      h += exportBar('exam');
    }
    return h;
  }
  exporters.exam = function () { return { title: 'К контрольной: ' + (ex.topic.trim() || ex.subject), blocks: L.examBlocks(ex.subject, ex.topic, ex.plan) }; };
  Kid.register({ key: 'exam', title: 'К контрольной', subtitle: 'План повторения по дням', view: vExam, acts: {
    stExSubject: function (v) { ex.subject = v; },
    stExDays: function (v) { ex.days = v; },
    stExGo: function () {
      if (!ex.topic.trim()) { ex.error = 'Напиши тему контрольной.'; return undefined; }
      return run(ex, L.promptExamPlan(ex.subject, Kid.grade()), 'Тема: ' + ex.topic + '. Дней до контрольной: ' + ex.days.replace(/\D.*$/, '') + '.', { max: 2200 }, function (raw) {
        var p = L.parseExamPlan(raw);
        if (!p) ex.error = 'Не получилось составить план, попробуй ещё раз.'; else ex.plan = p;
      });
    },
  } });

  // ====================================================================== Конспект параграфа
  var nt = Kid.mod('notes', { subject: 'История', text: '', result: null, busy: false, error: '', thumb: null, ocr: false, listening: false });

  function vNotes() {
    var h = Kid.head('Конспект параграфа', 'Кратко, термины и вопросы');
    h += '<div class="card"><label>Предмет</label>' + Kid.chips(SUBJ, nt.subject, 'stNtSubject') + taskInput('notes', nt, 'Текст параграфа (или фото страницы)', { field: 'text', photo: 'stNtPhoto', voice: 'stNtVoice' }) +
      btn('stNtGo', 'Сделать конспект', '', null, dis(nt)) + '</div>';
    if (nt.busy) h += Kid.busy('Делаю конспект…');
    h += Kid.err(nt.error);
    var r = nt.result;
    if (r) {
      h += '<div class="card tint"><label>Кратко</label><pre>' + esc(r.short) + '</pre></div>';
      if (r.plan.length) h += '<div class="card"><label>План</label>' + r.plan.map(function (p, i) { return '<div class="st-num">' + (i + 1) + '. ' + esc(p) + '</div>'; }).join('') + '</div>';
      if (r.terms.length) h += '<div class="card"><label>Термины</label>' + r.terms.map(function (t) { return '<div class="st-num"><b>' + esc(t.term) + '</b> — ' + esc(t.meaning) + '</div>'; }).join('') + '</div>';
      if (r.questions.length) h += '<div class="card tint"><label>Вопросы для самопроверки</label>' + r.questions.map(function (q, i) { return '<div class="st-num">' + (i + 1) + '. ' + esc(q) + '</div>'; }).join('') + '</div>';
      h += exportBar('notes');
    }
    return h;
  }
  exporters.notes = function () { return { title: 'Конспект: ' + nt.subject, blocks: L.notesBlocks(nt.result) }; };
  Kid.register({ key: 'notes', title: 'Конспект параграфа', subtitle: 'Кратко, термины и вопросы', view: vNotes, acts: {
    stNtSubject: function (v) { nt.subject = v; },
    stNtPhoto: photoAct(nt, 'text'),
    stNtVoice: voiceAct(nt, 'text'),
    stNtGo: function () {
      if (!nt.text.trim()) { nt.error = 'Добавь текст параграфа.'; return undefined; }
      return run(nt, L.promptNotes(nt.subject, Kid.grade()), nt.text, { max: 2500 }, function (raw) {
        var r = L.parseNotes(raw);
        if (!r) nt.error = 'Не получилось сделать конспект, попробуй ещё раз.'; else nt.result = r;
      });
    },
  } });

  // ====================================================================== Слова и диктант
  var wd = Kid.mod('words', { mode: 'Карточки', topic: '', own: '', revealed: false, dictation: [], dIdx: 0, showAll: false, busy: false, error: '' });
  function deck() { return Kid.store('cards_main', []); }
  function setDeck(d) { Kid.saveStore('cards_main', d); wd.revealed = false; }

  function vWords() {
    var h = Kid.head('Слова и диктант', 'Карточки и слова для диктанта'), cards = deck(), queue = L.queue(cards), cur = queue[0];
    h += '<div class="card">' + Kid.chips(['Карточки', 'Диктант'], wd.mode, 'stWdMode') +
      Kid.input('words.topic', wd.topic, 'Тема (' + (wd.mode === 'Карточки' ? 'например: Английский: еда' : 'например: Правописание: безударные гласные') + ')');
    if (wd.mode === 'Карточки') {
      h += btn('stWdWords', 'Подобрать 10 слов', '', null, dis(wd)) + ta('words.own', wd.own, 'Свои слова (по строке: слово - перевод)') + btn('stWdOwn', 'Добавить свои', 't') + '</div>';
      if (wd.busy) h += Kid.busy('Думаю…');
      h += Kid.err(wd.error);
      if (!cards.length) h += '<p class="mut">Колода пока пуста.</p>';
      else if (!cur) h += '<div class="card good"><b>Все слова выучены. Молодец!</b></div>' + btn('stWdReset', 'Повторить всё', 't');
      else {
        h += '<p class="mut">Осталось: ' + queue.length + ' из ' + cards.length + '</p><div class="card flash"><div><div class="st-front">' + esc(cur.f) + '</div>' +
          (wd.revealed ? '<div class="st-back">' + esc(cur.b) + '</div>' : '') + '</div></div>';
        h += wd.revealed ? '<div class="row">' + btn('stWdKnown', 'Знаю') + btn('stWdAgain', 'Ещё раз', 't') + '</div>' : btn('stWdShow', 'Показать перевод');
      }
      if (cards.length) { exporters.wordsDeck = function () { return { title: 'Слова', blocks: L.wordsBlocks(deck()) }; }; h += exportBar('wordsDeck'); }
    } else {
      h += btn('stWdDict', 'Подобрать слова для диктанта', '', null, dis(wd)) + '</div>';
      if (wd.busy) h += Kid.busy('Думаю…');
      h += Kid.err(wd.error);
      var dw = wd.dictation;
      if (dw.length) {
        h += '<p class="mut">Слово ' + (wd.dIdx + 1) + ' из ' + dw.length + '</p><div class="row">' + btn('stWdSay', 'Прочитать') + btn('stWdNext', 'Дальше', 't') + '</div>' +
          btn('stWdAll', wd.showAll ? 'Скрыть слова' : 'Проверить себя: показать слова', 'o');
        if (wd.showAll) h += '<div class="card"><pre>' + esc(dw.map(function (w, i) { return (i + 1) + '. ' + w; }).join('\n')) + '</pre></div>';
        exporters.dictation = function () { return { title: 'Диктант', blocks: L.dictationBlocks(wd.dictation) }; };
        h += exportBar('dictation');
      }
    }
    return h;
  }
  Kid.register({ key: 'words', title: 'Слова и диктант', subtitle: 'Карточки и слова для диктанта', view: vWords, acts: {
    stWdMode: function (v) { wd.mode = v; wd.error = ''; Kid.stopSpeak(); },
    stWdWords: function () {
      if (!wd.topic.trim()) { wd.error = 'Напиши тему.'; return undefined; }
      return run(wd, L.promptWords(Kid.grade()), 'Тема: ' + wd.topic, { max: 900 }, function (raw) {
        var w = L.parseWords(raw);
        if (!w) wd.error = 'Не получилось подобрать слова, попробуй ещё раз.'; else setDeck(L.mergeDeck(deck(), w));
      });
    },
    stWdOwn: function () {
      var w = L.parseWordLines(wd.own);
      if (!w.length) { wd.error = 'Пиши по строке: apple - яблоко.'; return; }
      setDeck(L.addOwn(deck(), w)); wd.own = ''; wd.error = '';
    },
    stWdShow: function () { wd.revealed = true; },
    stWdKnown: function () { setDeck(L.markKnown(deck())); },
    stWdAgain: function () { setDeck(L.repeatLater(deck())); },
    stWdReset: function () { setDeck(L.resetDeck(deck())); },
    stWdDict: function () {
      return run(wd, L.promptDictation(Kid.grade()), 'Тема: ' + (wd.topic.trim() || 'любые слова по возрасту'), { max: 600, temp: 0.7 }, function (raw) {
        var w = L.parseDictation(raw);
        if (!w) wd.error = 'Не получилось подобрать слова, попробуй ещё раз.'; else { wd.dictation = w; wd.dIdx = 0; wd.showAll = false; }
      });
    },
    stWdSay: function () { if (wd.dictation[wd.dIdx] != null) Kid.speak(wd.dictation[wd.dIdx]); },
    stWdNext: function () { if (wd.dIdx < wd.dictation.length - 1) wd.dIdx++; },
    stWdAll: function () { wd.showAll = !wd.showAll; },
  } });
})();

</script>
<script>
// Раздел «Наглядно» (VisualScreen, Screens2.kt + Draw.kt) и рукописный ввод Kid.hand (Handwriting.kt).
// Вся математика считается в visual-lib.js, ИИ тут нужен только для распознавания рукописи.
(function () {
  'use strict';
  var Kid = window.Kid, L = window.Kid_visual, esc = Kid.esc;
  var GA = L.GraphAnalysis, fmt = GA.fmt;

  }

        r.steps.map(function (s, i) { return '<p>' + (i + 1) + '. ' + esc(s) + '</p>'; }).join('') + '<p><b>Ответ: ' + esc(r.answer) + '</b></p>';
    }
    var p = key === 'graph' ? m.graph : key === 'triangle' ? m.triangle : m.pic;
    h += imgHtml + (p.facts && p.facts.trim() ? paragraphs(p.facts) : '');
    if (p.extra && p.extra.length) h += '<pre style="font-family:Courier New,monospace">' + esc(p.extra.join('\n')) + '</pre>';
    return h;
  }
  function picOf(key) { return key === 'graph' ? m.graph : key === 'triangle' ? m.triangle : key === 'pic' ? m.pic : m.column; }

  // ====================================================================== действия
  function cleanErr(e) { return e && e.message ? e.message : 'Не получилось построить график.'; }
  Kid.register({ key: 'visual', title: 'Наглядно', subtitle: 'График, чертёж, столбик, схемы', view: view, acts: {
    vMode: function (v) { m.mode = v; m.msg = ''; },
    vGraph: function () {
      m.errG = ''; m.msg = '';
      try {
        var info = GA.analyze(L.MathExpr.parse(m.formula));
        m.graph = { svg: graphSvg(info, m.formula), title: 'График y = ' + String(m.formula).trim(), facts: GA.describe(info),
          extra: info.table.map(function (r) { return 'x = ' + fmt(r[0]) + '   y = ' + (r[1] === null ? 'нет' : fmt(r[1])); }) };
      } catch (e) {
        m.graph = null;
        m.errG = e instanceof L.MathParseError ? (e.message || 'Не получилось разобрать формулу.') : 'Не получилось построить график.';
      }
    },
    vTri: function () {
      m.msg = '';
      var t = L.TriangleGeometry.fromText(m.tri);
      if (!t) { m.triangle = null; m.errT = L.TriangleGeometry.problemMessage(m.tri); return; }
      m.errT = '';
      var facts = 'Стороны: a = ' + fmt(t.a) + ', b = ' + fmt(t.b) + ', c = ' + fmt(t.c) + '.\n' +
        'Углы: A = ' + fmt(t.angleA) + '°, B = ' + fmt(t.angleB) + '°, C = ' + fmt(t.angleC) + '°.\n' +
        'Периметр P = ' + fmt(t.perimeter) + ', площадь S = ' + fmt(t.area) + '.\nВид: ' + t.kind + '.';
      m.triangle = { svg: triangleSvg(t), title: 'Чертёж треугольника', facts: facts };
    },
    vCol: function () {
      m.msg = '';
      var r = L.ColumnMath.solve(m.col);
      m.column = r;
      m.errC = r ? '' : 'Запиши пример так: 2345+678, 5002−1789, 357×24 или 1248:12.';
    },
    vScheme: function (v) { m.scheme = v; m.pic = null; m.msg = ''; },
    vElement: function (v) { m.element = v; },
    vDraw: function () {
      m.msg = '';
      if (m.scheme === 'Круговорот воды') m.pic = { svg: waterSvg(), title: 'Круговорот воды в природе', facts: L.WATER_FACTS };
      else if (m.scheme === 'Растительная клетка') m.pic = { svg: cellSvg(), title: 'Растительная клетка', facts: L.CELL_FACTS };
      else if (m.scheme === 'Атом') {
        var a = atomSvg(Math.max(0, L.ELEMENT_NAMES.indexOf(m.element)));
        m.pic = { svg: a.svg, title: 'Атом: ' + m.element, facts: a.facts };
      } else {
        var items = L.parseTimeline(m.events);
        m.pic = { svg: timelineSvg(m.title, items), title: String(m.title).trim() || 'Лента времени', facts: items.map(function (i) { return i[0] + ' — ' + i[1]; }).join('\n') };
      }
    },
    vWord: function (key) {
      var p = picOf(key); if (!p) return;
      m.msg = '';
      if (key === 'column') { Kid.saveWord(fileTitle(key), docBody(key, '')); m.msg = 'Файл Word сохранён.'; return; }
      var sz = svgSize(p.svg);
      return svgToPng(p.svg, sz[0], sz[1]).then(function (png) {
        Kid.saveWord(fileTitle(key), docBody(key, '<p><img src="' + png + '" width="620" alt="' + esc(p.title) + '"></p>')); m.msg = 'Файл Word сохранён.';
      }, function (e) { m.msg = e.message; });
    },
    vPrint: function (key) {
      var p = picOf(key); if (!p) return;
      var ok = Kid.printHtml(fileTitle(key), docBody(key, '<div style="max-width:100%">' + (key === 'column' ? '' : p.svg.replace(/width="\d+" height="\d+"/, 'style="width:100%;height:auto"')) + '</div>'));
      m.msg = ok ? '' : 'Браузер заблокировал окно печати. Разреши всплывающие окна для этой страницы.';
    },
  } });

  // Enter в полях раздела = нажатие главной кнопки
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing) return;
    var b = e.target && e.target.getAttribute && e.target.getAttribute('data-bind');
    var map = { 'visual.formula': 'vGraph', 'visual.tri': 'vTri', 'visual.col': 'vCol' };
    if (b && map[b]) { var btn = document.querySelector('[data-act="' + map[b] + '"]'); if (btn) btn.click(); }
  });

  // ====================================================================== Рукописный ввод: Kid.hand
  var HW_CSS = '#hw-overlay{position:fixed;inset:0;z-index:30;background:#fff;display:flex;flex-direction:column;color:#1d1b26;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}' +
    '#hw-overlay .hw-bar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px;overflow-x:auto;border-bottom:1px solid #ddd6ee;min-height:56px}' +
    '#hw-overlay .hw-bar button{flex:none;font:inherit;border:1px solid #ddd6ee;background:#fff;color:#625d72;border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap}' +
    '#hw-overlay .hw-bar button.on{background:#6a4fc2;border-color:#6a4fc2;color:#fff}' +
    '#hw-overlay .hw-bar .hw-x{font-size:20px;line-height:1;padding:6px 12px}' +
    '#hw-overlay .hw-bar .sw{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ddd6ee}' +
    '#hw-overlay .hw-bar .sw.on{box-shadow:0 0 0 3px #6a4fc2;background-clip:padding-box}' +
    '#hw-overlay .hw-bar .sep{flex:none;width:1px;height:26px;background:#ddd6ee;margin:0 2px}' +
    '#hw-overlay .hw-main{flex:1 1 auto;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}' +
    '#hw-overlay canvas{display:block;width:100%;background:#fff;touch-action:none;cursor:crosshair}' +
    '#hw-overlay .hw-res{padding:16px;max-width:820px;margin:0 auto}' +
    '#hw-overlay .hw-res textarea{width:100%;min-height:110px;font:inherit;padding:10px 12px;border:1px solid #ddd6ee;border-radius:12px}' +
    '#hw-overlay .hw-res button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:11px 18px;background:#6a4fc2;color:#fff;cursor:pointer;margin:8px 8px 0 0;max-width:100%}' +
    '#hw-overlay .hw-res button.t{background:#ece6fb;color:#6a4fc2}' +
    '#hw-overlay .hw-res .e{color:#b3261e;margin:8px 0}#hw-overlay .hw-res .mut{color:#625d72;font-size:14px}' +
    '#hw-overlay .hw-foot{flex:none;padding:12px 16px;border-top:1px solid #ddd6ee}' +
    '#hw-overlay .hw-foot button{width:100%;font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 18px;background:#6a4fc2;color:#fff;cursor:pointer}' +
    '#hw-overlay .hw-foot button:disabled{opacity:.5;cursor:default}';
  var COLORS = ['#111111', '#195ac8', '#c82828', '#14823c'], WIDTHS = [[1.5, 'Тонкая'], [2, 'Средняя'], [3.5, 'Толстая']];

  var hw = null;   // состояние открытого окна; null, когда закрыто
  function hwOpen(onDone) {
    if (hw) hwClose();
    if (!document.getElementById('hw-style')) { var st = document.createElement('style'); st.id = 'hw-style'; st.textContent = HW_CSS; document.head.appendChild(st); }
    var stylusOnly = false; try { stylusOnly = !!Kid.store('hw.stylusOnly', false); } catch (e) { /* без настроек */ }
    hw = { cb: typeof onDone === 'function' ? onDone : function () {}, strokes: [], live: null, eraser: false, color: COLORS[0], base: 2, stylusOnly: stylusOnly,
      result: '', busy: false, error: '', token: {}, cssW: 0, cssH: 0, prevOverflow: document.body.style.overflow };
    var el = hw.el = document.createElement('div');
    el.id = 'hw-overlay'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Рукописный ввод');
    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';
    hwBuild();
    window.addEventListener('resize', hwResize);
    document.addEventListener('keydown', hwKey, true);
  }
  function hwKey(e) { if (hw && e.key === 'Escape') { e.preventDefault(); hwClose(); } }
  function hwClose() {
    if (!hw) return;
    window.removeEventListener('resize', hwResize); document.removeEventListener('keydown', hwKey, true);
    document.body.style.overflow = hw.prevOverflow || '';
    hw.token = null;   // ответ ИИ, пришедший позже, игнорируем
    if (hw.el.parentNode) hw.el.parentNode.removeChild(hw.el);
    hw = null;
  }
  function btn(id, label, on, extra) { return '<button type="button" data-hw="' + id + '"' + (on ? ' class="on"' : '') + (extra || '') + '>' + label + '</button>'; }
  function hwBuild() {
    var h = '<div class="hw-bar"><button type="button" class="hw-x" data-hw="close" aria-label="Закрыть">✕</button>' +
      btn('stylus', 'Только стилус', hw.stylusOnly) + btn('touch', 'Стилус, палец, мышь', !hw.stylusOnly) + '<span class="sep"></span>' +
      btn('pen', 'Ручка', !hw.eraser) + btn('eraser', 'Ластик', hw.eraser) + '<span class="sep"></span>' +
      COLORS.map(function (c) { return '<button type="button" class="sw' + (hw.color === c && !hw.eraser ? ' on' : '') + '" data-hw="color" data-c="' + c + '" style="background:' + c + '" aria-label="Цвет"></button>'; }).join('') +
      '<span class="sep"></span>' + WIDTHS.map(function (w) { return btn('width', w[1], hw.base === w[0], ' data-w="' + w[0] + '"'); }).join('') +
      '<span class="sep"></span>' + btn('undo', 'Отменить', false) + btn('clear', 'Очистить', false) + '</div>' +
      '<div class="hw-main"><canvas></canvas><div class="hw-res"></div></div>' +
      '<div class="hw-foot"><button type="button" data-hw="recognize">Распознать запись</button></div>';
    hw.el.innerHTML = h;
    hw.cv = hw.el.querySelector('canvas');
    hw.res = hw.el.querySelector('.hw-res');
    hw.main = hw.el.querySelector('.hw-main');
    hw.bar = hw.el.querySelector('.hw-bar');
    hw.foot = hw.el.querySelector('.hw-foot');
    hw.el.onclick = hwClick;
    hwSizeCanvas(); hwBindCanvas(); hwResult();
  }
  function hwRefreshBar() {
    // обновляем только подсветку кнопок: рисунок и прокрутка панели не сбрасываются
    hw.bar.querySelectorAll('[data-hw]').forEach(function (b) {
      var id = b.getAttribute('data-hw'), on;
      if (id === 'stylus') on = hw.stylusOnly; else if (id === 'touch') on = !hw.stylusOnly;
      else if (id === 'pen') on = !hw.eraser; else if (id === 'eraser') on = hw.eraser;
      else if (id === 'color') on = hw.color === b.getAttribute('data-c') && !hw.eraser;
      else if (id === 'width') on = hw.base === parseFloat(b.getAttribute('data-w'));
      else return;
      b.classList.toggle('on', on);
    });
  }
  function hwSizeCanvas() {
    var w = Math.max(200, Math.floor(hw.main.clientWidth)), h = Math.max(260, Math.floor(hw.el.clientHeight - hw.bar.offsetHeight - hw.foot.offsetHeight - 8));
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    hw.cssW = w; hw.cssH = h; hw.dpr = dpr;
    hw.cv.width = Math.round(w * dpr); hw.cv.height = Math.round(h * dpr);
    hw.cv.style.height = h + 'px';
    hwRedraw();
  }
  function hwResize() { if (hw) hwSizeCanvas(); }
  function hwSeg(g, s, i) {
    g.strokeStyle = s.color; g.fillStyle = s.color; g.lineWidth = s.widths[i]; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(s.pts[i - 1].x, s.pts[i - 1].y); g.lineTo(s.pts[i].x, s.pts[i].y); g.stroke();
  }
  function hwDrawStroke(g, s) {
    if (s.pts.length === 1) { g.fillStyle = s.color; g.beginPath(); g.arc(s.pts[0].x, s.pts[0].y, s.widths[0] / 2, 0, 2 * PI); g.fill(); }
    for (var i = 1; i < s.pts.length; i++) hwSeg(g, s, i);
  }
  function hwRedraw() {
    var g = hw.cv.getContext('2d');
    g.setTransform(hw.dpr, 0, 0, hw.dpr, 0, 0);
    g.fillStyle = '#fff'; g.fillRect(0, 0, hw.cssW, hw.cssH);
    g.strokeStyle = '#e3e8f0'; g.lineWidth = 1;
    for (var y = 56; y < hw.cssH; y += 56) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(hw.cssW, y + 0.5); g.stroke(); }
    hw.strokes.forEach(function (s) { hwDrawStroke(g, s); });
    if (hw.live) hwDrawStroke(g, hw.live);
  }
  function hwBindCanvas() {
    var cv = hw.cv, active = null;
    function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function widthFor(e) {
      var pr = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.5;
      return hw.base + hw.base * 1.6 * pr;
    }
    function eraseAt(p) {
      var before = hw.strokes.length, reach = 22;
      hw.strokes = hw.strokes.filter(function (s) { return !s.pts.some(function (q) { return Math.hypot(q.x - p.x, q.y - p.y) < reach; }); });
      if (hw.strokes.length !== before) hwRedraw();
    }
    cv.addEventListener('pointerdown', function (e) {
      if (!hw || active !== null) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      var isStylus = e.pointerType === 'pen';
      if (hw.stylusOnly && !isStylus) return;
      var erasing = hw.eraser || (e.pointerType === 'pen' && (e.buttons & 32) === 32);
      active = { id: e.pointerId, erasing: erasing };
      try { cv.setPointerCapture(e.pointerId); } catch (x) { /* не критично */ }
      e.preventDefault();
      var p = pos(e);
      if (erasing) eraseAt(p);
      else { hw.live = { pts: [p], widths: [widthFor(e)], color: hw.color }; hwRedraw(); }
    });
    cv.addEventListener('pointermove', function (e) {
      if (!hw || !active || e.pointerId !== active.id) return;
      e.preventDefault();
      var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [e];
      if (!evs.length) evs = [e];
      evs.forEach(function (ev) {
        var p = pos(ev);
        if (active.erasing) eraseAt(p);
        else if (hw.live) {
          hw.live.pts.push(p); hw.live.widths.push(widthFor(ev));
          var g = cv.getContext('2d'); g.setTransform(hw.dpr, 0, 0, hw.dpr, 0, 0); hwSeg(g, hw.live, hw.live.pts.length - 1);
        }
      });
    });
    function end(e) {
      if (!hw || !active || e.pointerId !== active.id) return;
      if (!active.erasing && hw.live) { hw.strokes.push(hw.live); }
      hw.live = null; active = null; hwRedraw();
    }
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  function hwResult() {
    var h = '';
    if (hw.busy) h += '<p class="mut">Читаю запись…</p>';
    if (hw.error) h += '<p class="e">' + esc(hw.error) + '</p>';
    if (hw.result) {
      h += '<p class="mut">Распознанная запись (можно править)</p><textarea data-hw-text>' + esc(hw.result) + '</textarea>' +
        '<button type="button" data-hw="done">Вставить в задание</button><button type="button" class="t" data-hw="solve">Вставить и решить по шагам</button>';
    }
    hw.res.innerHTML = h;
    var ta = hw.res.querySelector('textarea');
    if (ta) ta.addEventListener('input', function () { hw.result = ta.value; });
    var rb = hw.el.querySelector('[data-hw="recognize"]'); if (rb) rb.disabled = hw.busy;
  }
  // Картинка для ИИ: белый фон, чёрные штрихи, как в Kotlin
  function hwImage() {
    var cv = document.createElement('canvas'); cv.width = hw.cssW; cv.height = hw.cssH;
    var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    hw.strokes.forEach(function (s) { hwDrawStroke(g, { pts: s.pts, widths: s.widths, color: '#000' }); });
    return cv.toDataURL('image/jpeg', 0.85);
  }
  function hwRecognize() {
    if (hw.busy) return;
    if (!hw.strokes.length || !hw.cssW || !hw.cssH) { hw.error = 'Сначала напиши что-нибудь.'; hwResult(); return; }
    var data = hwImage(), tok = hw.token;
    hw.busy = true; hw.error = ''; hwResult();
    Kid.askAI(HAND_PROMPT, 'Перепиши эту запись.', data, 1500, 0).then(function (text) {
      if (!hw || hw.token !== tok) return;
      Kid.touchToday(); hw.busy = false; hw.result = String(text).trim(); if (!hw.result) hw.error = 'ИИ вернул пустой ответ. Попробуй ещё раз.';
      hwResult(); hw.main.scrollTop = hw.main.scrollHeight;
    }, function (err) {
      if (!hw || hw.token !== tok) return;
      hw.busy = false; hw.error = (err && err.message) || 'Не получилось распознать.'; hwResult();
    });
  }
  // Prompts.handwriting()
  var HAND_PROMPT = 'Это рукописная запись школьника. Перепиши текст в точности как написано, ничего не решай и не исправляй, ' +
    'даже ошибки. Каждую строку записи выводи с новой строки. Формулы пиши в одну строку. Если слово неразборчиво, поставь [?]. ' +
    'Выводи только перепечатанный текст.';

  function hwClick(e) {
    var b = e.target.closest && e.target.closest('[data-hw]'); if (!b || !hw) return;
    var id = b.getAttribute('data-hw');
    if (id === 'close') hwClose();
    else if (id === 'stylus' || id === 'touch') { hw.stylusOnly = id === 'stylus'; try { Kid.saveStore('hw.stylusOnly', hw.stylusOnly); } catch (x) { /* ок */ } hwRefreshBar(); }
    else if (id === 'pen') { hw.eraser = false; hwRefreshBar(); }
    else if (id === 'eraser') { hw.eraser = true; hwRefreshBar(); }
    else if (id === 'color') { hw.color = b.getAttribute('data-c'); hw.eraser = false; hwRefreshBar(); }
    else if (id === 'width') { hw.base = parseFloat(b.getAttribute('data-w')); hwRefreshBar(); }
    else if (id === 'undo') { if (hw.strokes.length) { hw.strokes.pop(); hwRedraw(); } }
    else if (id === 'clear') { hw.strokes = []; hw.result = ''; hw.error = ''; hwRedraw(); hwResult(); }
    else if (id === 'recognize') hwRecognize();
    else if (id === 'done' || id === 'solve') {
      var text = hw.result, cb = hw.cb, solve = id === 'solve';
      hwClose();
      try { cb(text, solve); } catch (err) { console.error(err); }
    }
  }

  Kid.hand = { open: hwOpen, close: hwClose, isOpen: function () { return !!hw; } };
})();

</script>
<script>
// Разделы «Чтение», «Историческая справка», «Что задано», «Спроси друга», «AR-линза».
// Логика (разбор ответов, тексты для ИИ, адреса Викитеки и Википедии, тревога, коды) лежит в world-lib.js.
(function () {
  'use strict';
  var Kid = window.Kid, W = window.Kid_world, esc = Kid.esc;
  var P = W.Prompts, RL = W.ReaderLogic, WP = W.WikiParser, NA = W.NetAdvice, AP = W.AssignedParser, AR = W.ArParser, AD = W.AlertDetector, CI = W.CodeInfo, RLst = W.ReadingList;

  // ---------- стили этого модуля ----------
  (function () {
    var st = document.createElement('style');
    st.textContent =
      '.w-banner{background:#ffe9b8;color:#3d2e00;border-radius:16px;padding:12px 14px;margin:0 0 12px;font-weight:500}' +
      '.w-page{background:#fffbf2}.w-page pre{line-height:1.5}' +
      '.w-click{cursor:pointer}.w-click.on{background:var(--vl)}' +
      '.w-alert{border:3px solid #b25a00;background:#fff3e0;border-radius:16px;padding:16px;margin:0 0 12px}' +
      '.w-alert h3{margin:0 0 8px;font-size:21px}.w-alert p{margin:6px 0;font-size:17px}' +
      '.w-chat{max-height:340px;overflow-y:auto;padding:2px}' +
      '.w-sys{font-size:13px;font-style:italic;color:var(--mut);margin:6px 0}' +
      '.w-orb{display:block;margin:10px auto 4px;width:88px;height:88px;border-radius:50%;border:0;background:var(--v);color:#fff;font:inherit;font-weight:700;cursor:pointer}' +
      '.w-orb.l{background:var(--err)}.w-orb.t{background:#9a82db}.w-orb.s{background:var(--ok)}' +
      '.w-center{text-align:center}' +
      '.w-arwrap{position:relative;margin:0 0 12px}.w-arwrap canvas{display:block;width:100%;height:auto;border-radius:12px;cursor:pointer;background:#eee}' +
      '.w-bubble{position:absolute;width:260px;max-width:92%;background:rgba(255,255,255,.96);border:2px solid var(--v);border-radius:14px;padding:10px;font-size:13px;line-height:1.35;color:#000;box-shadow:0 2px 10px rgba(0,0,0,.25)}' +
      '.w-bubble b{display:block;font-size:15px;margin-bottom:2px}' +
      '.w-vslot video,.w-video{width:100%;max-height:420px;border-radius:12px;background:#000;display:block}' +
      '.w-num{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;color:#fff;font-size:13px;font-weight:700;margin-right:8px}' +
      '.w-hsrc{font-size:12px;color:var(--mut)}';
    document.head.appendChild(st);
